<style>
:root {
  --bg: #080b0f; --surface: #111519; --raise: #181e26; --card: #13181f;
  --line: #222a35; --text: #e8edf3; --muted: #7a8799; --subtle: #3d4f62;
  --accent: #5ec99a; --on-accent: #021a0e; --live: #ff3d3d;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body {
  background: var(--bg); color: var(--text);
  font: 400 15px/1.6 "Schibsted Grotesk", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
}
a { color: inherit; text-decoration: none }
button { font-family: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px }

/* ── header ── */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(8,11,15,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line); flex: none;
}
.header-inner {
  display: flex; align-items: center; gap: 14px;
  height: 52px; max-width: 1400px; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-left));
}
.back-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 600 13px "Schibsted Grotesk", sans-serif;
  transition: color .15s, border-color .15s;
}
.back-btn:hover { color: var(--text); border-color: var(--muted) }
.brand {
  font: 800 20px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -.05em;
  color: var(--text); text-decoration: none; display: flex; align-items: center;
}
.brand em { font-style: normal; color: var(--accent) }
.hd-meta { flex: 1; min-width: 0; overflow: hidden }
.hd-title { font: 700 14px "Schibsted Grotesk", sans-serif; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hd-sub { font: 400 11px "JetBrains Mono", monospace; color: var(--muted) }
.hd-right { display: flex; align-items: center; gap: 10px; flex: none }
.live-badge {
  background: var(--live); color: #fff;
  font: 700 10px/1 "Schibsted Grotesk", sans-serif; letter-spacing: .06em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 5px; display: flex; align-items: center; gap: 4px;
}
.ld { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.viewer-count {
  display: flex; align-items: center; gap: 5px;
  font: 600 11px "JetBrains Mono", monospace; color: var(--muted);
}
.viewer-icon { opacity: .7 }

/* ── main layout ── */
.main-layout {
  display: flex; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto;
  padding: 0 max(16px, env(safe-area-inset-left));
  gap: 20px; align-items: flex-start;
}
@media (max-width: 900px) { .main-layout { flex-direction: column; gap: 0 } }

/* ── player column ── */
.player-col { flex: 1; min-width: 0; padding-top: 20px }
@media (max-width: 900px) { .player-col { padding-top: 0 } }

.player-wrap {
  position: relative; width: 100%; background: #000;
  border-radius: 16px; overflow: hidden; aspect-ratio: 16/9;
}
.player-wrap video, .player-wrap iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block;
}
.player-msg {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
}
.player-loading { animation: pulse 1.4s ease-in-out infinite }
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }
.open-tab-btn {
  padding: 9px 20px; border-radius: 9px; border: 1px solid var(--line);
  background: transparent; color: var(--text); font: 600 13px "Schibsted Grotesk", sans-serif;
  transition: border-color .15s;
}
.open-tab-btn:hover { border-color: var(--muted) }

/* quality switcher */
.quality-bar {
  display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; align-items: center;
}
.q-label { font: 600 11px "JetBrains Mono", monospace; color: var(--subtle); flex: none }
.q-btn {
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 500 11px "JetBrains Mono", monospace;
  transition: all .15s;
}
.q-btn:hover { border-color: var(--muted); color: var(--text) }
.q-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(94,201,154,.08) }

/* stream info */
.stream-info { margin-top: 18px }
.stream-cat {
  font: 700 10px "Schibsted Grotesk", sans-serif; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.stream-name { font: 800 22px/1.2 "Schibsted Grotesk", sans-serif; letter-spacing: -.03em; margin: 0 0 6px }
.stream-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.stream-meta-item { display: flex; align-items: center; gap: 5px }
.share-btn {
  margin-top: 16px; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 9px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 600 13px "Schibsted Grotesk", sans-serif;
  transition: all .15s;
}
.share-btn:hover { border-color: var(--muted); color: var(--text) }
.share-btn.copied { border-color: var(--accent); color: var(--accent) }

/* ── chat column ── */
.chat-col {
  width: 320px; flex: none; position: sticky; top: 72px;
  height: calc(100dvh - 92px); display: flex; flex-direction: column;
  padding-top: 20px;
}
@media (max-width: 900px) {
  .chat-col { width: 100%; position: static; height: auto; padding-top: 12px; padding-bottom: 20px }
}

.chat-box {
  flex: 1; display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
}
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 15px; border-bottom: 1px solid var(--line); flex: none;
}
.chat-title { font: 700 13px "Schibsted Grotesk", sans-serif }
.chat-user-badge {
  font: 500 11px "JetBrains Mono", monospace; color: var(--accent);
  background: rgba(94,201,154,.08); border: 1px solid rgba(94,201,154,.2);
  padding: 3px 9px; border-radius: 5px;
}

.chat-msgs {
  flex: 1; overflow-y: auto; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  min-height: 0;
}
@media (max-width: 900px) { .chat-msgs { height: 300px } }
.chat-msgs::-webkit-scrollbar { width: 4px }
.chat-msgs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px }

.chat-msg {
  display: flex; gap: 7px; align-items: flex-start; padding: 4px 6px; border-radius: 7px;
  transition: background .1s; animation: fadeIn .2s ease-out;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.chat-msg:hover { background: var(--raise) }
.msg-name {
  font: 700 11px "Schibsted Grotesk", sans-serif; color: var(--accent);
  flex: none; white-space: nowrap; min-width: 0;
}
.msg-name.self { color: var(--blue, #4da3ff) }
.msg-text { font: 400 13px "Schibsted Grotesk", sans-serif; word-break: break-word; flex: 1; min-width: 0 }
.msg-ts { font: 400 10px "JetBrains Mono", monospace; color: var(--subtle); flex: none; margin-top: 2px }

.chat-system {
  text-align: center; font-size: 11px; color: var(--subtle); padding: 6px; font-family: "JetBrains Mono", monospace;
}
.chat-disabled {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; padding: 20px; text-align: center; color: var(--subtle); font-size: 13px;
}
.chat-disabled code {
  font: 500 11px "JetBrains Mono", monospace;
  background: var(--raise); padding: 3px 8px; border-radius: 5px;
  color: var(--muted); display: block; margin-top: 4px;
}

.chat-input-row {
  display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex: none;
}
.chat-input {
  flex: 1; background: var(--raise); border: 1px solid var(--line); border-radius: 9px;
  color: var(--text); font: 400 13px "Schibsted Grotesk", sans-serif;
  padding: 8px 12px; outline: none; transition: border-color .15s; resize: none;
}
.chat-input::placeholder { color: var(--subtle) }
.chat-input:focus { border-color: rgba(94,201,154,.4) }
.chat-send {
  width: 36px; height: 36px; border-radius: 9px; border: none;
  background: var(--accent); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  flex: none; transition: opacity .15s; align-self: flex-end;
}
.chat-send:hover { opacity: .82 }
.chat-send:disabled { opacity: .3 }

.spam-warn {
  padding: 6px 12px; background: rgba(255,61,61,.1); border-top: 1px solid rgba(255,61,61,.2);
  font: 500 11px "JetBrains Mono", monospace; color: var(--live); flex: none;
  display: none;
}

/* ── states ── */
.full-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 40px; color: var(--muted);
}
.full-state h2 { margin: 0; color: var(--text); font-size: 20px; letter-spacing: -.02em }
.full-state p { margin: 0; max-width: 28em; font-size: 14px }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important } }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js" integrity="sha512-LMPOAjBLAiNMIjz1MXSJe4MHBv/QMkKdRFRa8HKf4L1A5jUfhVhE8FkJtCBF0gp4TkmOkLCTgxDxhXH/a5Mg==" crossorigin="anonymous"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
(function () {
  var API = 'https://streamfree.top/api/v1';
  var EMOJI = { soccer:'⚽', basketball:'🏀', hockey:'🏒', combat:'🥊', baseball:'⚾', football:'🏈', racing:'🏎', tennis:'🎾', cricket:'🏏' };
  var SPORT_LABELS = { soccer:'Soccer', basketball:'Basketball', hockey:'Hockey', combat:'Combat', baseball:'Baseball', football:'Football', racing:'Racing', tennis:'Tennis', cricket:'Cricket' };

  // ── username generator ──
  var ADJS  = ['Swift','Bold','Iron','Dark','Quick','Wild','Sharp','Cool','Bright','Stone','Silent','Rapid','Fierce','Calm','Brave','Epic','Slick','Icy','Grim','Flash'];
  var NOUNS = ['Fox','Bear','Wolf','Hawk','Tiger','Panda','Eagle','Viper','Lynx','Drake','Raven','Cobra','Bison','Falcon','Moose','Shark','Lion','Orca','Jaguar','Rhino'];
  function genUsername() {
    var a=ADJS[Math.floor(Math.random()*ADJS.length)];
    var n=NOUNS[Math.floor(Math.random()*NOUNS.length)];
    var d=Math.floor(Math.random()*90)+10;
    return a+n+d;
  }
  var username;
  try { username=localStorage.getItem('kestrel_username')||null; } catch(e){}
  if (!username) { username=genUsername(); try{localStorage.setItem('kestrel_username',username);}catch(e){} }

  // ── anti-spam state ──
  var lastMsgTime = 0;
  var msgTimes = [];
  var cooldownUntil = 0;
  var lastMsgText = '';
  var SPAM_INTERVAL = 3000;
  var BURST_COUNT = 5;
  var BURST_WINDOW = 20000;
  var COOLDOWN_MS = 30000;
  var BAD_WORDS = ['spam','fuck','shit','nigger','faggot'];

  function checkSpam(text) {
    var now = Date.now();
    if (now < cooldownUntil) return 'Slow down! Wait '+ Math.ceil((cooldownUntil-now)/1000)+'s.';
    if (now - lastMsgTime < SPAM_INTERVAL) return 'Too fast — wait a moment.';
    if (text.trim() === lastMsgText) return "Don't repeat yourself.";
    var lower = text.toLowerCase();
    for (var i=0;i<BAD_WORDS.length;i++) if (lower.indexOf(BAD_WORDS[i])!==-1) return 'Message contains disallowed content.';
    msgTimes = msgTimes.filter(function(t){return now-t<BURST_WINDOW;});
    if (msgTimes.length >= BURST_COUNT) { cooldownUntil=now+COOLDOWN_MS; return 'Sending too fast. '+Math.ceil(COOLDOWN_MS/1000)+'s timeout.'; }
    return null;
  }
  function recordSend(text) {
    lastMsgTime=Date.now(); lastMsgText=text.trim();
    msgTimes.push(lastMsgTime);
  }

  // ── Firebase ──
  var FIREBASE_READY = false;
  var db = null;
  try {
    if (typeof FIREBASE_CONFIG!=='undefined' && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('YOUR_PROJECT')) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      FIREBASE_READY = true;
    }
  } catch(e) { console.warn('Firebase init failed', e); }

  // ── params ──
  var params = new URLSearchParams(location.search);
  var streamId = params.get('id');
  var streamTs = parseInt(params.get('ts')||'0',10);

  function slugify(str){return(str||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function isLive(ts){return !ts||ts<=Date.now()/1000+300;}
  function qualityLabel(url){var m=url.match(/(\d{3,4}p)/i);return m?m[1].toLowerCase():null;}
  function bestSource(sources){
    var pref=['1080p','720p','540p','480p','360p'];
    for(var i=0;i<pref.length;i++)for(var j=0;j<sources.length;j++)if(qualityLabel(sources[j])===pref[i])return sources[j];
    return sources[0]||null;
  }
  function fmt(ts){
    if(!ts)return '';
    var diff=ts*1000-Date.now();
    if(Math.abs(diff)<4*3600000){if(diff<0)return'started '+fmtRel(Math.abs(diff))+' ago';return'in '+fmtRel(diff);}
    var d=new Date(ts*1000);
    return d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+' · '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  }
  function fmtRel(ms){var m=Math.round(ms/60000);return m<60?m+'m':Math.round(m/60)+'h';}
  function fmtTime(ts){var d=new Date(ts);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}

  // ── player ──
  var hlsInst=null;
  var activeSrc=null;
  var playerWrap=document.getElementById('player-wrap');

  function loadSource(src) {
    if(src===activeSrc)return; activeSrc=src;
    if(hlsInst){try{hlsInst.destroy();}catch(e){}hlsInst=null;}
    playerWrap.innerHTML='';
    updateExternalLink(src);

    var isHls=/\.m3u8(\?|$)/i.test(src);
    var canNativeHls=document.createElement('video').canPlayType('application/vnd.apple.mpegurl');

    if(isHls && window.Hls && Hls.isSupported()){
      var vid=document.createElement('video'); vid.controls=true; vid.autoplay=true; vid.playsInline=true;
      playerWrap.appendChild(vid);
      hlsInst=new Hls({enableWorker:true,lowLatencyMode:true,xhrSetup:function(xhr){xhr.withCredentials=false;}});
      hlsInst.loadSource(src); hlsInst.attachMedia(vid);
      hlsInst.on(Hls.Events.ERROR,function(e,data){
        if(data.fatal){
          // CORS or network error — fall through to iframe silently
          if(hlsInst){try{hlsInst.destroy();}catch(ex){}hlsInst=null;}
          playerWrap.innerHTML='';
          loadIframe(src);
        }
      });
    } else if(isHls && canNativeHls) {
      var vid=document.createElement('video'); vid.controls=true; vid.autoplay=true; vid.playsInline=true; vid.src=src;
      playerWrap.appendChild(vid);
    } else {
      loadIframe(src);
    }
  }

  function loadIframe(src) {
    var iframe=document.createElement('iframe');
    iframe.src=src; iframe.allowFullscreen=true;
    iframe.allow='autoplay; fullscreen; picture-in-picture'; iframe.scrolling='no';
    // referrerpolicy helps with some embed providers
    iframe.setAttribute('referrerpolicy','no-referrer-when-downgrade');
    playerWrap.appendChild(iframe);
  }

  function updateExternalLink(src) {
    var bar=document.getElementById('external-bar');
    var link=document.getElementById('external-link');
    if(bar&&link){ link.href=src; bar.style.display='flex'; bar.hidden=false; }
  }

  // ── quality bar ──
  function buildQualityBar(sources, currentSrc) {
    var qbar=document.getElementById('quality-bar'); qbar.innerHTML='';
    if(sources.length<2)return;
    var label=document.createElement('span'); label.className='q-label'; label.textContent='Quality:'; qbar.appendChild(label);
    sources.forEach(function(src){
      var q=qualityLabel(src)||'auto';
      var btn=document.createElement('button'); btn.className='q-btn'+(src===currentSrc?' active':''); btn.textContent=q;
      btn.addEventListener('click',function(){
        qbar.querySelectorAll('.q-btn').forEach(function(b){b.classList.remove('active');});
        btn.classList.add('active'); loadSource(src);
      });
      qbar.appendChild(btn);
    });
  }

  // ── viewer count (Firebase presence) ──
  var viewerRef=null;
  var sessionRef=null;
  function initViewers(chatId) {
    if(!FIREBASE_READY||!db)return;
    var connRef=db.ref('.info/connected');
    sessionRef=db.ref('viewers/'+chatId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2));
    connRef.on('value',function(snap){
      if(snap.val()===true){
        sessionRef.onDisconnect().remove();
        sessionRef.set(true);
        db.ref('viewers/'+chatId).on('value',function(s){
          var n=s.numChildren();
          document.getElementById('viewer-n').textContent=n||'—';
          document.getElementById('viewer-count').hidden=false;
        });
      }
    });
  }

  // ── chat ──
  var chatMsgsEl=document.getElementById('chat-msgs');
  var chatInput=document.getElementById('chat-input');
  var chatSend=document.getElementById('chat-send');
  var spamWarn=document.getElementById('spam-warn');
  var chatBannedUsers={};

  function showSpamWarn(msg) {
    spamWarn.textContent=msg; spamWarn.style.display='block';
    clearTimeout(spamWarn._t); spamWarn._t=setTimeout(function(){spamWarn.style.display='none';},4000);
  }

  function appendMessage(data, key) {
    if(data.deleted)return;
    var row=document.createElement('div'); row.className='chat-msg'; row.dataset.key=key||'';
    var isSelf=data.username===username;
    var name=document.createElement('span'); name.className='msg-name'+(isSelf?' self':''); name.textContent=data.username; row.appendChild(name);
    var text=document.createElement('span'); text.className='msg-text'; text.textContent=data.text; row.appendChild(text);
    var ts=document.createElement('span'); ts.className='msg-ts'; ts.textContent=fmtTime(data.ts); row.appendChild(ts);
    chatMsgsEl.appendChild(row);
    chatMsgsEl.scrollTop=chatMsgsEl.scrollHeight;
    // keep max 200 messages
    while(chatMsgsEl.children.length>200) chatMsgsEl.removeChild(chatMsgsEl.firstChild);
  }

  function addSystemMsg(text) {
    var s=document.createElement('div'); s.className='chat-system'; s.textContent=text;
    chatMsgsEl.appendChild(s); chatMsgsEl.scrollTop=chatMsgsEl.scrollHeight;
  }

  function initChat(chatId) {
    document.getElementById('chat-username-badge').textContent=username;
    addSystemMsg('You joined as '+username);

    if(FIREBASE_READY && db) {
      initFirebaseChat(chatId);
    } else {
      initLocalChat();
    }
  }

  // ── local chat (works without Firebase — messages visible in this session only) ──
  function initLocalChat() {
    addSystemMsg('Live chat · session only — messages visible to you');

    // Restore messages from sessionStorage so they survive navigation
    var storeKey='kestrel_chat_'+location.search;
    var stored=[];
    try{stored=JSON.parse(sessionStorage.getItem(storeKey)||'[]');}catch(e){}
    stored.forEach(function(m){appendMessage(m,m.key);});

    // BroadcastChannel lets other tabs on the same browser share messages
    var bc=null;
    try{ if(typeof BroadcastChannel!=='undefined') bc=new BroadcastChannel('kestrel_chat_'+chatId); }catch(e){}
    if(bc){
      bc.onmessage=function(e){
        if(e.data&&e.data.username!==username){appendMessage(e.data,e.data.key);}
      };
    }

    function sendMsg() {
      var text=(chatInput.value||'').trim(); if(!text)return;
      var warn=checkSpam(text); if(warn){showSpamWarn(warn);return;}
      recordSend(text);
      chatInput.value='';
      var msg={text:text,username:username,ts:Date.now(),key:Date.now().toString(36)};
      appendMessage(msg,msg.key);
      // persist
      try{
        stored.push(msg);
        if(stored.length>200)stored=stored.slice(-200);
        sessionStorage.setItem(storeKey,JSON.stringify(stored));
      }catch(e){}
      // broadcast to other same-browser tabs
      if(bc){try{bc.postMessage(msg);}catch(e){}}
    }

    chatSend.addEventListener('click',sendMsg);
    chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  }

  // ── Firebase chat (cross-user real-time) ──
  function initFirebaseChat(chatId) {
    var msgsRef=db.ref('chats/'+chatId+'/messages');
    var bannedRef=db.ref('banned');
    bannedRef.on('value',function(s){chatBannedUsers=s.val()||{};});

    var initialLoad=true;
    msgsRef.limitToLast(80).on('child_added',function(snap){
      var data=snap.val();
      if(data&&!data.deleted&&!chatBannedUsers[data.username]) appendMessage(data,snap.key);
      if(initialLoad) chatMsgsEl.scrollTop=chatMsgsEl.scrollHeight;
    });
    setTimeout(function(){initialLoad=false;},1000);

    msgsRef.on('child_changed',function(snap){
      var data=snap.val();
      if(data&&data.deleted){var el=chatMsgsEl.querySelector('[data-key="'+snap.key+'"]');if(el)el.remove();}
    });

    function sendMsg() {
      var text=(chatInput.value||'').trim(); if(!text)return;
      var warn=checkSpam(text); if(warn){showSpamWarn(warn);return;}
      if(chatBannedUsers[username]){showSpamWarn('You have been banned from chat.');return;}
      recordSend(text); chatInput.value='';
      msgsRef.push({text:text,username:username,ts:Date.now()});
    }

    chatSend.addEventListener('click',sendMsg);
    chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
  }

  // ── share button ──
  document.getElementById('share-btn').addEventListener('click',function(){
    var url=location.href;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        var btn=document.getElementById('share-btn'); btn.textContent='Link copied!'; btn.classList.add('copied');
        setTimeout(function(){btn.innerHTML='<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><circle cx="13" cy="2.5" r="1.5"/><circle cx="13" cy="13.5" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><path d="M11.5 3.4 4 7.1M4 8.9l7.5 3.7" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>Share stream';btn.classList.remove('copied');},2000);
      });
    }
  });

  // ── main init ──
  function initStream(s) {
    var live=isLive(s.match_timestamp);
    var sources=s.sources||[];
    var best=bestSource(sources);
    var chatId=slugify(s.name);
    var emoji=EMOJI[s.category]||'📺';

    // update meta
    document.title='Kestrel · '+s.name;
    var ogTitle=document.querySelector('meta[property="og:title"]');
    var ogDesc=document.querySelector('meta[property="og:description"]');
    if(ogTitle)ogTitle.content=s.name+' · Kestrel Live';
    if(ogDesc)ogDesc.content=(s.league?s.league+' — ':'')+s.name+(live?' — LIVE NOW':'');

    // header
    document.getElementById('hd-title').textContent=s.name;
    document.getElementById('hd-sub').textContent=(s.league||'')+(s.match_timestamp&&!live?' · '+fmt(s.match_timestamp):'');
    document.getElementById('live-badge').hidden=!live;

    // info
    document.getElementById('s-cat').textContent=emoji+' '+(SPORT_LABELS[s.category]||s.category||'');
    document.getElementById('s-name').textContent=s.name;
    var meta=document.getElementById('s-meta');
    if(s.league){var li=document.createElement('span');li.className='stream-meta-item';li.textContent='🏆 '+s.league;meta.appendChild(li);}
    if(s.match_timestamp){var ti=document.createElement('span');ti.className='stream-meta-item';ti.textContent='🕐 '+(live?'Live now':fmt(s.match_timestamp));meta.appendChild(ti);}

    // player
    if(best){loadSource(best);}else{showFallback('');}
    buildQualityBar(sources,best);

    // show layout
    document.getElementById('main-layout').hidden=false;

    // firebase
    initViewers(chatId);
    initChat(chatId);
  }

  function showError(){document.getElementById('error-state').hidden=false;}

  // fetch and find stream
  fetch(API+'/streams').then(function(r){return r.json();}).then(function(data){
    var streams=data.streams||[];
    var match=null;
    for(var i=0;i<streams.length;i++){
      if(slugify(streams[i].name)===streamId){match=streams[i];break;}
    }
    if(!match){
      // fallback: find by closest timestamp
      for(var i=0;i<streams.length;i++){
        if(streams[i].match_timestamp===streamTs){match=streams[i];break;}
      }
    }
    if(match){initStream(match);}else{showError();}
  }).catch(function(){showError();});

})();
</script>
