<style>
:root{
  --c1:#2b6cff;--c2:#7a3cff;
  --ink:#fff;--mute:rgba(255,255,255,.62);--glass:rgba(255,255,255,.1);--glass-b:rgba(255,255,255,.18);
  --live:#ff4d6d;--amber:#ffc24a;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --tile:clamp(138px,17vw,224px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#070a18;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* background: color follows the focused tile */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#070a18}
.bg::before{content:'';position:absolute;inset:-20%;background:
  radial-gradient(60% 55% at 22% 30%,var(--c1),transparent 70%),
  radial-gradient(55% 60% at 82% 72%,var(--c2),transparent 70%);
  opacity:.75;transition:opacity .6s;filter:saturate(1.1)}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,24,.15),rgba(7,10,24,.78) 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.14;background:#fff;animation:float 14s ease-in-out infinite}
.blob:nth-child(1){width:140px;height:140px;left:6%;top:62%;animation-duration:16s}
.blob:nth-child(2){width:80px;height:80px;left:72%;top:18%;animation-duration:12s;animation-delay:-4s}
.blob:nth-child(3){width:200px;height:200px;left:88%;top:70%;animation-duration:19s;animation-delay:-8s}
.blob:nth-child(4){width:56px;height:56px;left:40%;top:10%;animation-duration:11s;animation-delay:-2s}
.blob:nth-child(5){width:110px;height:110px;left:52%;top:80%;animation-duration:15s;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-36px) scale(1.12)}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left))}

/* top bar */

/* stage */

.railwrap{position:relative;height:calc(var(--tile)*1.5);display:flex;align-items:center}

.tile{position:relative;flex:0 0 auto;width:var(--tile);height:var(--tile);border-radius:26%;overflow:hidden;cursor:pointer;

.tile.f{transform:scale(1.2);opacity:1;z-index:2;box-shadow:0 0 0 4px #fff,0 0 0 9px rgba(255,255,255,.22),0 22px 50px rgba(0,0,0,.55);animation:ring 2.2s ease-in-out infinite}

.bd img{max-width:100%;max-height:100%;object-fit:contain}

.pill.ico{display:inline-flex;align-items:center;gap:6px}.pill.ico svg{width:1.15em;height:1.15em}

.flag.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px;animation:blink 1s infinite}

.ban{position:relative;flex:none;width:clamp(190px,17vw,264px);height:min(100%,clamp(170px,31vh,300px));display:flex;flex-direction:column;overflow:hidden;background:rgba(12,18,38,.92);cursor:pointer;

/* launch gate */

  background:repeating-linear-gradient(90deg,#0C3326 0 9vw,#0A2C21 9vw 18vw);color:#F4F6F1;font-family:'Hanken Grotesk',system-ui,sans-serif;overflow:hidden;transition:opacity .8s ease}

.g-u{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

.g-d{height:1em;width:.55em;overflow:hidden;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(3.4rem,11vw,8.4rem);line-height:1;font-variant-numeric:tabular-nums;color:#F4F6F1}
.g-d>div{transition:transform .7s cubic-bezier(.22,1,.36,1);will-change:transform}
.g-d.snap>div{transition:none}

.g-l{font-weight:600;font-size:.95rem;color:#D6E4DA;padding-left:2px}
.g-bar{width:min(560px,100%);display:flex;flex-direction:column;gap:10px;font-size:.85rem;font-weight:500;color:#D6E4DA}
.g-track{position:relative;height:3px;background:rgba(244,246,241,.3)}

.g-kb svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.g-pop input:focus{border-color:#3DDC97}

.g-pop button:disabled{opacity:.6;cursor:wait}

@keyframes gshake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.g-d>div{transition:none}}
/* skin: print/scoreboard look for the classic menu, schedule, stream sheet and player. The console home menu (.home) is deliberately untouched. */
:root{color-scheme:dark;--k-pitch:#3DDC97;--k-turf:#5BE6AA;--k-chalk:#0B0F0D;--k-paper:#141B17;--k-ink:#EAF0EC;--k-mute:#8FA096;--k-line:#26302A;--k-red:#FF6B5E;--k-board:#0F1512;--k-on:#0B0F0D;
  --k-disp:'Big Shoulders Display','Arial Narrow',sans-serif;--k-body:'Hanken Grotesk',system-ui,sans-serif}
.bg{display:none}
body{background:var(--k-chalk)}
.app{color:var(--k-ink);font-family:var(--k-body);padding-top:max(14px,env(safe-area-inset-top))}
.app .top{gap:6px 26px;padding-bottom:10px;border-bottom:2px solid var(--k-ink);align-items:flex-end}
.app .brand{font-family:var(--k-disp);font-weight:900;font-size:2.1rem;line-height:1;letter-spacing:.01em;color:var(--k-pitch);margin:0 6px 4px 0;gap:8px}
.app .brand i{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;display:grid}
.app .brand svg{width:1.05em;height:1.05em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.app .tabs{gap:0;align-items:flex-end}
.app .tab{font-family:var(--k-body);font-weight:600;font-size:.98rem;padding:8px 2px 7px;margin-right:22px;border-radius:0;color:var(--k-mute);border-bottom:3px solid transparent;transform:none;transition:color .15s,border-color .15s}
.app .tab:hover{color:var(--k-ink)}
.app .tab.on{color:var(--k-ink);background:none;border-bottom-color:var(--k-ink)}
.app .tab.kb{outline:2px solid var(--k-pitch);outline-offset:2px;transform:none}
.app .tab small{font-family:var(--k-disp);font-weight:700;font-size:1rem;opacity:1;margin-left:6px;color:var(--k-pitch)}
.app .tab.sch{margin-right:0;color:var(--k-pitch)}
.app .chips{gap:4px}
.app .chip{width:34px;height:34px;border-radius:5px;background:transparent;border:1.5px solid var(--k-line);color:var(--k-ink);transition:background .15s,border-color .15s}
.app .chip:hover{transform:none;border-color:var(--k-ink)}
.app .chip.on{background:var(--k-ink);border-color:var(--k-ink);color:var(--k-on);box-shadow:none}
.app .clock{font-family:var(--k-disp);font-weight:700;font-size:1.7rem;line-height:1;color:var(--k-ink)}
.app .sys{align-items:flex-end}

.app .stage{flex-direction:row;justify-content:stretch;align-items:stretch;gap:clamp(20px,3.4vw,56px);padding-top:6px}
.app .railwrap{flex:1.2;min-width:0;height:auto;display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--k-line) transparent;align-items:initial}
.app .rail{display:block;transform:none!important;transition:none;gap:0}
.fday{position:sticky;top:0;z-index:1;background:var(--k-chalk);font-family:var(--k-disp);font-weight:800;font-size:1.15rem;padding:16px 4px 6px;border-bottom:2px solid var(--k-ink);color:var(--k-ink)}
.fday:first-child{padding-top:8px}
.frow{display:grid;grid-template-columns:4.6rem 66px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 8px;border-bottom:1px solid var(--k-line);cursor:pointer;color:var(--k-ink);transition:background .12s}
.frow:hover{background:rgba(18,80,58,.07)}
.frow.f{background:var(--k-ink);color:#fff;border-bottom-color:var(--k-ink)}
.frow .ft{font-family:var(--k-disp);font-weight:700;font-size:1.55rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .fx{display:flex;gap:4px;align-items:center}
.frow .fx img{width:28px;height:28px;object-fit:contain}
.frow .fx svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.frow .fn{min-width:0;display:flex;flex-direction:column}
.frow .fn b{font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* times from the API are UK GMT; day headers look like "Friday 30th October 2026" */
function eventDate(time,header){
  const [h,m]=(time||'00:00').split(':').map(Number);
  const mt=/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\s+(\d{4})/.exec(header||'');
  if(mt){const mi=MONTHS.indexOf(mt[2].slice(0,3).toLowerCase());if(mi>=0)return new Date(Date.UTC(+mt[3],mi,+mt[1],h,m))}
  const n=new Date();return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+(/tomorrow/i.test(header)?1:0),h,m))
}
function stat(e){const d=Date.now()-e.date;return d<0?'up':d<3*36e5?'live':'done'}

  if(k(d)===k(t))return'Today';const n=new Date(t);n.setDate(n.getDate()+1);
  if(k(d)===k(n))return'Tomorrow';return d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}

/* strmfree.st categories don't match the old heuristic (its "football" means NFL, not soccer; "combat" spans boxing+mma) */
const CATMAP={soccer:'football',basketball:'basketball',hockey:'hockey',baseball:'baseball',football:'nfl',racing:'racing',tennis:'tennis',cricket:'cricket'};
const catSport=(cat,league,name)=>{
  if(cat==='combat')return/ufc|mma|bellator|pfl/i.test(league+' '+name)?'mma':'boxing';
  return CATMAP[cat]||sportOf(cat||'')
};
function parse(raw){
  const streams=raw.streams||raw.data?.streams||[],out=[];let id=0;
  for(const ev of streams){
    const srcs=(ev.live_sources?.length?ev.live_sources:ev.sources)||[];
    const chs=srcs.map((s,i)=>({channel_name:s.quality?`${s.quality}${srcs.filter(x=>x.quality===s.quality).length>1?' '+(i+1):''}`:`Stream ${i+1}`,channel_id:s.url,logo_url:''})).filter(c=>c.channel_id);
    if(!chs.length)continue;
    if(ev.team1?.logo)crests[ev.team1.name.toLowerCase()]=ev.team1.logo;
    if(ev.team2?.logo)crests[ev.team2.name.toLowerCase()]=ev.team2.logo;
    out.push({id:id++,name:ev.name||'Event',sport:catSport(ev.category,ev.league,ev.name),cat:ev.league||ev.category,date:new Date((ev.match_timestamp||0)*1000),chs})
  }
  return out.sort((a,b)=>a.date-b.date)
}

/* best-effort real scores from ESPN's public scoreboards; matched by team name */
const ESPN=[['football','soccer/eng.1'],['football','soccer/esp.1'],['football','soccer/ita.1'],['football','soccer/ger.1'],['football','soccer/fra.1'],['football','soccer/uefa.champions'],['football','soccer/usa.1'],['basketball','basketball/nba'],['basketball','basketball/mens-college-basketball'],['nfl','football/college-football'],['nfl','football/nfl'],['baseball','baseball/mlb'],['hockey','hockey/nhl']];
async function loadScores(){
  for(const[k,p]of ESPN){
    try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${p}/scoreboard`);if(!r.ok)continue;
      const j=await r.json();
      for(const ev of j.events||[]){const c=ev.competitions?.[0]?.competitors||[];if(c.length<2)continue;
        const a=c[0].team.shortDisplayName.toLowerCase(),b=c[1].team.shortDisplayName.toLowerCase();
        for(const x of c){const L=x.team.logo;const C=x.team.color?'#'+x.team.color:'';if(L)for(const n of[x.team.shortDisplayName,x.team.displayName,x.team.name])if(n){crests[n.toLowerCase()]=L;if(C)tcol[n.toLowerCase()]=C}}
        scores[a+'|'+b]=`${c[0].score} - ${c[1].score}`;scores[b+'|'+a]=`${c[1].score} - ${c[0].score}`}
    }catch(e){}
  }
  draw(true)
}
function teams(n){const m=/^(.+?)\s+(?:vs?\.?|at)\s+(.+?)(?:\s*[-–(].*)?$/i.exec(n);return m?[m[1].trim(),m[2].trim()]:null}
function scoreOf(e){if(stat(e)==='done'&&0)return null;const t=teams(e.name);if(!t)return null;
  const a=t[0].toLowerCase(),b=t[1].toLowerCase();
  for(const k in scores){const[x,y]=k.split('|');if((a.includes(x)||x.includes(a))&&(b.includes(y)||y.includes(b)))return scores[k]}return null}

    .sort((a,b)=>key==='done'?b.date-a.date:a.date-b.date);
  return[...new Set(f.map(e=>e.sport))].flatMap(s=>f.filter(e=>e.sport===s))
}

}

function tileHTML(e,i){

function draw(keep){
  if(home)homeDraw(keep);
  const L=list();if(!keep)fi=0;if(fi>=L.length)fi=Math.max(0,L.length-1);
  drawChrome();

  if(!L.length){rail.innerHTML=`<div class="empty">Nothing here right now. Try another section or sport.</div>`;return}
  let cur='';rail.innerHTML=L.map((e,i)=>{let h='';
    if(e.sport!==cur){if(cur)h+='</div></section>';cur=e.sport;const n=L.filter(x=>x.sport===cur).length;
      h+=`<section class="sg" style="--a:${SP[cur][2]}"><h2>${ic(cur)}<span>${esc(SP[cur][1])}</span><small>${n}</small></h2><div class="cards">`}

function setColors(a,b){const r=document.documentElement.style;r.setProperty('--c1',a);r.setProperty('--c2',b)}
function focus(i){
  const L=list();if(!L.length)return;fi=Math.max(0,Math.min(L.length-1,i));
  const cs=[...$('rail').querySelectorAll('.kc')];cs.forEach((c,k)=>c.classList.toggle('f',k===fi&&mode!=='tabs'));
  if(cs[fi])cs[fi].scrollIntoView({block:'nearest'})
}
/* move focus to the nearest card in the row above (-1) or below (1); returns false if none */
function vmove(dir){
  const cs=[...$('rail').querySelectorAll('.kc')],c=cs[fi];if(!c)return false;
  const r=c.getBoundingClientRect();let best=-1,bd=1e9;
  cs.forEach((x,k)=>{const q=x.getBoundingClientRect(),dy=(q.top-r.top)*dir;if(dy<=4)return;
    const d=dy*1000+Math.abs(q.left-r.left);if(d<bd){bd=d;best=k}});
  if(best<0)return false;focus(best);return true}

  const units=[['Days',86400e3],['Hours',3600e3],['Minutes',60e3],['Seconds',1e3]],cd=document.getElementById('gCd');
  const digs=[];
  cd.innerHTML=units.map(([l],i)=>`<div class="g-u"><div class="g-card">${[0,1].map(()=>`<div class="g-d"><div>${[...Array(11)].map((_,n)=>`<span>${n%10}</span>`).join('')}</div></div>`).join('')}</div><div class="g-l">${l}</div></div>`).join('');
  cd.querySelectorAll('.g-d').forEach(d=>digs.push({el:d,col:d.firstChild,v:null}));
  function setDig(o,v){
    if(o.v===v)return;const prev=o.v;o.v=v;
    if(prev===null){o.el.classList.add('snap');o.col.style.transform=`translateY(${-v}em)`;void o.col.offsetWidth;o.el.classList.remove('snap');return}
    if(prev===9&&v===0){o.col.style.transform='translateY(-10em)';
      const fix=()=>{o.col.removeEventListener('transitionend',fix);if(o.v!==0)return;o.el.classList.add('snap');o.col.style.transform='translateY(0)';void o.col.offsetWidth;o.el.classList.remove('snap')};
      o.col.addEventListener('transitionend',fix)}
    else o.col.style.transform=`translateY(${-v}em)`}
  const fill=document.getElementById('gFill'),pct=document.getElementById('gPct');
  function tick(){
    let ms=Math.max(0,LAUNCH-now());
    if(ms===0&&!done){open();return}
    units.forEach(([,u],i)=>{let n=Math.floor(ms/u);ms-=n*u;if(i===0)n=Math.min(n,99);const s=String(n).padStart(2,'0');setDig(digs[i*2],+s[0]);setDig(digs[i*2+1],+s[1])});
    const p=Math.min(100,Math.max(0,(now()-START)/(LAUNCH-START)*100));fill.style.width=p+'%';pct.textContent=Math.floor(p)+'% there'}
  tick();setInterval(tick,250);
  /* beta code box */
  const key=document.getElementById('gKey'),inp=document.getElementById('gIn'),msg=document.getElementById('gMsg'),btn=document.getElementById('gGo'),pop=document.getElementById('gPop');
  document.getElementById('gKb').onclick=()=>{key.classList.toggle('open');if(key.classList.contains('open'))setTimeout(()=>inp.focus(),120)};
  async function submit(){
    const c=norm(inp.value);if(c.length!==12){msg.className='g-msg err';msg.textContent='Codes have 12 characters.';pop.classList.remove('shake');void pop.offsetWidth;pop.classList.add('shake');return}
    btn.disabled=true;msg.className='g-msg';msg.textContent='Checking…';
    let h='';try{h=await pbk(c)}catch(_){msg.className='g-msg err';msg.textContent='Needs a secure (https) connection.';btn.disabled=false;return}
    btn.disabled=false;
    if(G.h.includes(h)){try{localStorage.kbeta=h}catch(_){}msg.textContent='Welcome to the beta!';setTimeout(open,500)}
    else{msg.className='g-msg err';msg.textContent='That code isn\'t valid.';pop.classList.remove('shake');void pop.offsetWidth;pop.classList.add('shake');inp.select()}}
  btn.onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
})();
</script>
