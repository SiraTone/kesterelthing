<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kestrel · Games &amp; Projects</title>
<meta name="description" content="A collection of my games and projects.">
<meta property="og:title" content="Kestrel · Games &amp; Projects">
<meta property="og:description" content="A collection of my games and projects.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<style>
:root{--bg:#0d0f14;--card:#171a22;--line:#262a35;--text:#e8eaf0;--mute:#8b91a1;--accent:#ff9f43}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{padding:64px 0 32px}
header img{height:44px;margin-bottom:20px}
h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em}
header p{color:var(--mute);margin-top:8px;max-width:520px}
.tabs{display:flex;gap:8px;margin:8px 0 24px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 16px;border-radius:99px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-bottom:64px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#222736,#141720);display:grid;place-items:center;font-size:2.4rem;font-weight:700;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.body h2{font-size:1.15rem}
.body p{color:var(--mute);font-size:.92rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.75rem;border:1px solid var(--line);color:var(--mute);padding:2px 8px;border-radius:99px}
.empty{color:var(--mute);padding:40px 0}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/logo.png" alt="Kestrel" onerror="this.remove()">
    <h1>Games &amp; Projects</h1>
    <p>Things I've built. Click anything to play or take a look.</p>
  </header>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="game">Games</button>
    <button data-f="project">Projects</button>
  </div>
  <main class="grid" id="grid"></main>
  <footer>© <span id="y"></span> Kestrel</footer>
</div>
<script src="projects.js"></script>
<script>
const grid=document.getElementById('grid');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(f){
  const list=PROJECTS.filter(p=>f==='all'||p.type===f);
  grid.innerHTML=list.length?list.map(p=>`
    <a class="card" href="${esc(p.link)}">
      <div class="thumb">${p.image?`<img src="${esc(p.image)}" alt="" loading="lazy">`:esc(p.title[0])}</div>
      <div class="body">
        <div class="kind">${esc(p.type)}</div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.description)}</p>
        <div class="tags">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
      </div>
    </a>`).join(''):'<p class="empty">Nothing here yet.</p>';
}
document.getElementById('tabs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render(b.dataset.f);
};
document.getElementById('y').textContent=new Date().getFullYear();
render('all');
</script>
</body>
</html>
