<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kestrel Stream</title>
<meta name="description" content="Live sports, one menu. Pick a tile, pick a channel, watch.">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --c1:#2b6cff;--c2:#7a3cff;
  --ink:#fff;--mute:rgba(255,255,255,.62);--glass:rgba(255,255,255,.1);--glass-b:rgba(255,255,255,.18);
  --live:#ff4d6d;--amber:#ffc24a;
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --tile:clamp(138px,17vw,224px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#070a18;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* background: color follows the focused tile */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#070a18}
.bg::before{content:'';position:absolute;inset:-20%;background:
  radial-gradient(60% 55% at 22% 30%,var(--c1),transparent 70%),
  radial-gradient(55% 60% at 82% 72%,var(--c2),transparent 70%);
  opacity:.75;transition:opacity .6s;filter:saturate(1.1)}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,10,24,.15),rgba(7,10,24,.78) 70%)}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.14;background:#fff;animation:float 14s ease-in-out infinite}
.blob:nth-child(1){width:140px;height:140px;left:6%;top:62%;animation-duration:16s}
.blob:nth-child(2){width:80px;height:80px;left:72%;top:18%;animation-duration:12s;animation-delay:-4s}
.blob:nth-child(3){width:200px;height:200px;left:88%;top:70%;animation-duration:19s;animation-delay:-8s}
.blob:nth-child(4){width:56px;height:56px;left:40%;top:10%;animation-duration:11s;animation-delay:-2s}
.blob:nth-child(5){width:110px;height:110px;left:52%;top:80%;animation-duration:15s;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-36px) scale(1.12)}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left))}

/* top bar */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.5rem;display:flex;align-items:center;gap:9px;margin-right:6px}
.brand i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-style:normal;font-size:1.1rem;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:background .5s}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.05rem;padding:7px 18px;border-radius:99px;color:var(--mute);white-space:nowrap;transition:background .25s,color .25s,transform .35s var(--bounce)}
.tab.on{color:#fff;background:var(--glass-b)}
.tab.kb{outline:3px solid #fff;outline-offset:2px;transform:scale(1.06)}
.tab small{font-family:'Nunito';font-weight:800;opacity:.7;margin-left:6px}
.sys{display:flex;align-items:center;gap:12px}
.chips{display:flex;gap:6px}
.chip{width:36px;height:36px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:1.05rem;transition:transform .3s var(--bounce),background .2s}
.chip:hover{transform:scale(1.15)}
.chip.on{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.clock{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;position:relative}
.railwrap{position:relative;height:calc(var(--tile)*1.5);display:flex;align-items:center}
.rail{display:flex;gap:calc(var(--tile)*.12);align-items:center;will-change:transform;transition:transform .55s var(--bounce);padding-left:0}
.tile{position:relative;flex:0 0 auto;width:var(--tile);height:var(--tile);border-radius:26%;overflow:hidden;cursor:pointer;
  transform:scale(.86);opacity:.62;transition:transform .45s var(--bounce),opacity .3s,box-shadow .35s;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.tile.f{transform:scale(1.2);opacity:1;z-index:2;box-shadow:0 0 0 4px #fff,0 0 0 9px rgba(255,255,255,.22),0 22px 50px rgba(0,0,0,.55);animation:ring 2.2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 4px #fff,0 0 0 14px rgba(255,255,255,.1),0 22px 50px rgba(0,0,0,.55)}}
.art{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.art::before{content:'';position:absolute;width:130%;height:130%;left:-15%;top:-40%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 60%)}
.art::after{content:'';position:absolute;right:-18%;bottom:-18%;width:60%;height:60%;border-radius:50%;background:rgba(255,255,255,.1)}
.emo{width:calc(var(--tile)*.36);height:calc(var(--tile)*.36);color:#fff;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));position:relative;z-index:1}
.emo svg{width:100%;height:100%;stroke-width:1.4}
.bd{display:grid;place-items:center;width:100%;height:100%;background:#fff;border-radius:50%;padding:14%;box-sizing:border-box}
.bd img{max-width:100%;max-height:100%;object-fit:contain}
.bd svg{width:100%;height:100%;color:#223}
.emo.lg{width:calc(var(--tile)*.4);height:calc(var(--tile)*.4)}
.crests{position:relative;z-index:1;display:flex;align-items:center;gap:calc(var(--tile)*.03)}
.crests .bd{width:calc(var(--tile)*.3);height:calc(var(--tile)*.3);box-shadow:0 5px 10px rgba(0,0,0,.3)}
.crests i{font-style:normal;font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--tile)*.1);background:rgba(0,0,0,.3);padding:0 .45em;border-radius:99px;white-space:nowrap}
.pill.ico{display:inline-flex;align-items:center;gap:6px}.pill.ico svg{width:1.15em;height:1.15em}
.chip svg{width:20px;height:20px}.chip.on{color:#223}
.tile.f .emo{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(-6deg)}}
.vsline{position:relative;z-index:1;font-family:'Fredoka',sans-serif;font-weight:600;font-size:calc(var(--tile)*.082);text-align:center;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.35);max-width:100%;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vsline b{display:block;font-size:.7em;opacity:.7;letter-spacing:.12em;font-weight:600}
.sc{position:relative;z-index:1;font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--tile)*.15);font-variant-numeric:tabular-nums;background:rgba(0,0,0,.28);padding:0 .45em;border-radius:99px}
.flag{position:absolute;top:10px;left:10px;z-index:2;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.flag.live{background:var(--live)}
.flag.live::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.s-football{background:linear-gradient(145deg,#2fd27a,#0b7a55)}
.s-basketball{background:linear-gradient(145deg,#ffa23d,#e0501d)}
.s-tennis{background:linear-gradient(145deg,#d6f23f,#5fb02a)}
.s-cricket{background:linear-gradient(145deg,#4fd0b8,#1a7d9a)}
.s-rugby{background:linear-gradient(145deg,#a470ff,#4b2bb5)}
.s-boxing{background:linear-gradient(145deg,#ff5d6c,#a1163a)}
.s-mma{background:linear-gradient(145deg,#ff7a45,#8e1d2c)}
.s-racing{background:linear-gradient(145deg,#ff3d6e,#3a1c8f)}
.s-nfl{background:linear-gradient(145deg,#c98a4b,#6a3a1a)}
.s-baseball{background:linear-gradient(145deg,#5aa0ff,#1c3f9e)}
.s-hockey{background:linear-gradient(145deg,#7fe3ff,#2a74c8)}
.s-golf{background:linear-gradient(145deg,#8be36a,#1f8a4a)}
.s-darts{background:linear-gradient(145deg,#ff6bd5,#6a2bd0)}
.s-snooker{background:linear-gradient(145deg,#38c76f,#0b5a3a)}
.s-default{background:linear-gradient(145deg,#6b7bff,#2a2f8f)}

/* focused title + details */
.detail{margin-top:calc(var(--tile)*.3);padding-left:calc(var(--lead,0px));min-height:150px;max-width:min(760px,92vw);transition:opacity .25s}
.detail h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,3.6vw,2.7rem);line-height:1.08;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.pill{font-weight:800;font-size:.8rem;padding:4px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-b)}
.pill.live{background:var(--live);border-color:transparent}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.play{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;padding:11px 28px;border-radius:99px;background:#fff;color:#12142a;display:inline-flex;gap:9px;align-items:center;transition:transform .3s var(--bounce)}
.play:hover{transform:scale(1.07)}
.ghost{font-weight:800;font-size:.9rem;color:var(--mute)}
.empty{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--mute);padding:40px 0}

.hints{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-weight:700;font-size:.8rem;padding-top:8px}
.hints kbd{font:inherit;font-weight:800;color:#fff;background:var(--glass);border:1px solid var(--glass-b);border-radius:7px;padding:1px 8px;margin-right:6px}

/* stream picker */
.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:rgba(6,8,20,.55);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);opacity:0;pointer-events:none;transition:opacity .3s}
.panel.open{opacity:1;pointer-events:auto}
.sheet{width:min(1000px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:clamp(18px,3vw,36px);align-items:center;transform:translateY(30px) scale(.95);transition:transform .5s var(--bounce)}
.panel.open .sheet{transform:none}
@media(max-width:640px){.sheet{grid-template-columns:1fr;justify-items:center;text-align:center}.sheet .tile{--tile:150px}}
.sheet .tile{--tile:clamp(150px,22vw,230px);transform:none;opacity:1;cursor:default;animation:none;box-shadow:0 0 0 4px #fff,0 24px 60px rgba(0,0,0,.5)}
.sheet h2{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2.2rem);line-height:1.1;text-wrap:balance}
.sheet p{color:var(--mute);font-weight:700;margin:6px 0 18px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:14px 10px;border-radius:22px;background:var(--glass);border:2px solid var(--glass-b);text-decoration:none;color:#fff;font-weight:800;text-align:center;font-size:.9rem;transition:transform .35s var(--bounce),background .2s,border-color .2s}
.ch img{height:30px;max-width:90px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.ch .go{font-family:'Fredoka',sans-serif;font-size:.8rem;font-weight:600;color:#12142a;background:#fff;border-radius:99px;padding:2px 12px;opacity:0;transform:translateY(4px);transition:.25s}
.ch.f,.ch:hover{transform:scale(1.07);background:rgba(255,255,255,.22);border-color:#fff}
.ch.f .go,.ch:hover .go{opacity:1;transform:none}
.sheet.play{grid-template-columns:1fr}
.pv{display:flex;flex-direction:column;gap:12px;min-width:0}
.pv-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pv-top .back{margin:0;flex-shrink:0}
.pv-top h2{font-size:clamp(1.1rem,2.4vw,1.6rem)}
.screen{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - 230px)*16/9));margin:0 auto;background:#000;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 24px 60px rgba(0,0,0,.55)}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.screen-msg{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fredoka',sans-serif;color:var(--mute)}
.pv-bar{display:flex;flex-direction:column;gap:10px;align-items:center}
.chipset{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.chipset .lab{font-weight:800;font-size:.8rem;color:var(--mute)}
.mini{font-weight:800;font-size:.85rem;padding:7px 15px;border-radius:99px;background:var(--glass);border:2px solid var(--glass-b);color:#fff;text-decoration:none;transition:transform .3s var(--bounce),background .2s}
.mini:hover{transform:scale(1.08)}
.mini.on{background:#fff;color:#12142a;border-color:#fff}
.pv .note{text-align:center}
.back{margin-top:16px;font-weight:800;color:var(--mute);padding:6px 4px}
.back:hover{color:#fff}
.note{font-size:.78rem;color:var(--mute);margin-top:12px;font-weight:700}

:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:560px){.hints{display:none}.brand span{display:none}.top{gap:10px}.chips{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
.tile{width:calc(var(--tile)*1.7);height:calc(var(--tile)*1.22);border-radius:18px;background:#15112a!important;display:flex;flex-direction:column}
.tile .art{position:relative;inset:auto;flex:0 0 58%;flex-direction:row;gap:calc(var(--tile)*.16);padding:8px;overflow:hidden}
.tile .art::before,.tile .art::after{display:none}
.art i{font-style:normal;font-family:'Fredoka',sans-serif;font-weight:700;font-size:calc(var(--tile)*.17);position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.cr{height:62%;max-width:34%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.cr.big{height:70%;max-width:60%}
.emo{width:calc(var(--tile)*.44);height:calc(var(--tile)*.44)}
.info{flex:1;padding:9px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;text-align:left}
.nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:calc(var(--tile)*.098);line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .row{display:flex;justify-content:space-between;gap:8px;font-size:calc(var(--tile)*.07);opacity:.8;white-space:nowrap}
.info .row span:first-child{overflow:hidden;text-overflow:ellipsis}
.info .flag{position:static;background:none;padding:0;backdrop-filter:none;font-size:inherit;font-weight:700}
.info .flag.live{background:none;color:#ff5470}
.sheet{grid-template-columns:minmax(220px,360px) 1fr}
.sheet .tile{--tile:clamp(130px,17vw,210px)}
@media(max-width:640px){.sheet{grid-template-columns:1fr}.sheet .tile{--tile:150px}}
/* theatre player */
.panel.theatre{padding:0;background:#05060d;backdrop-filter:none;-webkit-backdrop-filter:none}
.panel.theatre .sheet{width:100%;height:100%;max-height:none;overflow:visible;display:block;transform:none!important}
.pv{position:fixed;inset:0;display:flex;flex-direction:column;background:#05060d;z-index:1}
.pbar{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(var(--c1rgb,95,112,255),.28),rgba(8,10,24,.96));border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.pv.min .pbar{display:none}
.ptitle{flex:1;min-width:140px}
.ptitle h2{font-size:clamp(1rem,2vw,1.3rem);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--mute);flex-wrap:wrap}
.psub .pill{padding:1px 9px;font-size:.72rem}
.pv-w{font-weight:800;color:#fff}
.pright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:transform .3s var(--bounce),background .2s}
.pb:hover{transform:scale(1.07);background:rgba(255,255,255,.2)}
.pb.sq{padding:8px 12px}
.rate .ti{display:grid;width:18px;height:18px}.rate svg{width:100%;height:100%}
.rate.dn .ti{transform:rotate(180deg)}
.rate b{font-variant-numeric:tabular-nums;min-width:1ch}
.rate.on{background:#2ee59d;border-color:#2ee59d;color:#05261a}
.rate.dn.on{background:#ff5470;border-color:#ff5470;color:#2a0510}
.pmenu{position:absolute;right:max(16px,env(safe-area-inset-right));top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));padding:16px;border-radius:20px;
  background:rgba(14,16,36,.96);border:2px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.pmenu[hidden]{display:none}
.pmenu .lab{font-weight:800;font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pmenu .chipset{justify-content:flex-start}
.pstage{position:relative;flex:1;min-height:0;background:#000}
.pstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.phandle{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:none;padding:2px 22px;border-radius:99px;background:rgba(10,12,28,.75);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1rem;backdrop-filter:blur(8px)}
.pv.min .phandle{display:block}
.pv:fullscreen .pbar{padding-top:10px}
@media(max-width:640px){.pbar{gap:8px}.pb{padding:7px 12px}.ptitle{order:-1;flex-basis:100%}.pv-w{order:3}}
/* admin */
.banner{margin:0 auto;padding:7px 18px;text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;font-size:.9rem}
.admbtn{opacity:.45;font-size:.75rem;font-weight:800;padding:6px 10px;border-radius:99px;background:var(--glass)}.admbtn:hover{opacity:1}
.adm{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(5,6,16,.78);backdrop-filter:blur(14px)}
.adm.open{display:grid}
.adm-box{position:relative;width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px;border-radius:26px;background:#12142e;border:2px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.adm-box.wide{width:min(900px,100%)}
.adm-box input{font:inherit;padding:11px 16px;border-radius:99px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;min-width:0;flex:1}
.adm-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--glass);color:#fff}
.adm-note{color:var(--mute);line-height:1.5}.adm-err{color:#ff7d92;font-weight:700}
.adm-bn{display:flex;gap:8px}
.adm-list{display:flex;flex-direction:column;gap:8px}
.adm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.05)}
.adm-row.off{opacity:.5}
.adm-n{flex:1;min-width:180px;display:flex;flex-direction:column}.adm-n small{color:var(--mute)}
.adm-s{font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.sys .admbtn{border:0;color:#fff;font-family:inherit}
/* home menu */
.home{display:none;position:fixed;inset:0;z-index:10;flex-direction:column;--hc:#4aa3ff;--ht:clamp(78px,14vh,150px);--lead:max(22px,6vw);--gap:clamp(8px,1.2vh,14px);
  background:linear-gradient(160deg,#0b45c8 0%,#0a33a3 45%,#082170 100%);color:#fff;overflow:hidden;font-family:'Nunito',system-ui,sans-serif}
body.home-mode .home{display:flex}
body.home-mode .app{visibility:hidden}
.home::before{content:'';position:absolute;inset:-30%;background:
  radial-gradient(40% 35% at 20% 15%,color-mix(in srgb,var(--hc) 55%,transparent),transparent 70%),
  radial-gradient(45% 40% at 85% 80%,rgba(80,140,255,.35),transparent 70%);transition:background 1s;animation:hdrift 18s ease-in-out infinite alternate}
.home::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.035) 120px 122px),linear-gradient(180deg,transparent 60%,rgba(3,10,50,.55))}
@keyframes hdrift{to{transform:translate(4%,3%) scale(1.08)}}
.home>*{position:relative;z-index:1}
.hstat{display:flex;align-items:center;gap:clamp(14px,3vw,40px);padding:max(18px,3vh) var(--lead) 0;font-size:clamp(.8rem,1.7vh,1.05rem);font-weight:300;flex-wrap:wrap}
.hstat b{font-weight:800;letter-spacing:.02em;font-size:1.15em}
.hs-l{display:flex;gap:10px;align-items:center}.hs-logo{width:1.7em;height:1.7em;display:grid}.hs-logo svg{width:100%;height:100%}
.hs-note{display:flex;align-items:center;gap:8px;opacity:.95}
.dot{width:.65em;height:.65em;border-radius:50%;background:#ff5470;box-shadow:0 0 0 0 rgba(255,84,112,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}}
.hs-r{margin-left:auto;display:flex;align-items:center;gap:clamp(12px,2.4vw,30px)}
.hs-user{display:flex;gap:8px;align-items:center}.av{width:1.9em;height:1.9em;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;padding:.3em}.av svg{width:100%;height:100%}
.hs-clock{font-size:1.5em;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hrowwrap{position:relative;height:calc(var(--ht)*2.25);margin-top:clamp(10px,3vh,34px);padding-left:var(--lead);overflow:hidden;flex:none}
.hrow{display:flex;gap:var(--gap);align-items:flex-start;padding-top:calc(var(--ht)*.1);transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
.ht{position:relative;flex:none;width:var(--ht);height:var(--ht);background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.04)),rgba(8,30,120,.55);border:2px solid transparent;cursor:pointer;overflow:hidden;
  transition:width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1),background .3s,border-color .2s}
.ht[style*="--a"]{background:linear-gradient(160deg,var(--a),var(--b))}
.hi{position:absolute;inset:0;display:grid;place-items:center;padding:24%;transition:padding .35s,transform .35s;bottom:0}
.hi svg{width:100%;height:100%;stroke-width:1.2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.ht:hover{border-color:rgba(255,255,255,.5)}
.ht.f{width:calc(var(--ht)*1.7);height:calc(var(--ht)*2.05);margin-top:calc(var(--ht)*-.1);border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 0 38px rgba(255,255,255,.28);
  background:linear-gradient(170deg,rgba(255,255,255,.28),rgba(255,255,255,.06)),rgba(10,45,160,.75)}
.ht.f[style*="--a"]{background:linear-gradient(165deg,var(--a),var(--b))}
.ht.f.dim{box-shadow:none;border-color:rgba(255,255,255,.55)}
.ht.f .hi{padding:20% 20% 38%}
.hl{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;text-align:center;background:rgba(0,10,60,.4);transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column;line-height:1.15}
.ht.f .hl{transform:none}
.hl b{font-weight:800;font-size:clamp(.9rem,2.2vh,1.4rem)}.hl small{opacity:.85;font-weight:300;font-size:clamp(.75rem,1.7vh,1rem)}
.htitle{position:absolute;left:calc(var(--lead) + var(--ht)*1.7 + 26px);top:calc(var(--ht)*1.25);right:20px}
.htitle h1{font-weight:300;font-size:clamp(1.6rem,6.2vh,3.6rem);line-height:1.05;margin:0;letter-spacing:.005em}
.htitle p{margin:6px 0 0;font-weight:300;font-size:clamp(.85rem,2vh,1.2rem);opacity:.85}
.hstrip{flex:1;min-height:0;display:flex;align-items:flex-end;gap:clamp(10px,1.6vw,22px);padding:14px var(--lead) clamp(52px,8vh,76px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-padding:0 var(--lead)}
.hstrip::-webkit-scrollbar{display:none}
.hstrip.dim{opacity:.9}
.ban{position:relative;flex:none;width:clamp(190px,17vw,264px);height:min(100%,clamp(170px,31vh,300px));display:flex;flex-direction:column;overflow:hidden;background:rgba(5,20,100,.78);cursor:pointer;
  border:2px solid transparent;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .3s}
.ban:hover{border-color:rgba(255,255,255,.55)}
.ban.f{transform:scale(1.07);border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 14px 40px rgba(0,0,20,.5);z-index:2}
.ban .art{position:relative;inset:auto;flex:0 0 64%;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:8px;overflow:hidden}
.ban .art::before,.ban .art::after{display:none}
.ban .art i{font-style:normal;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(.9rem,2.4vh,1.5rem);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.ban .cr{height:60%;max-width:36%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}.ban .cr.big{height:68%;max-width:60%}
.ban .emo{width:34%;height:auto;aspect-ratio:1}
.ban .info{flex:1;padding:8px 12px 9px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;text-align:left}
.ban .nm{font-weight:700;font-size:clamp(.82rem,2vh,1.1rem);line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ban .row{display:flex;justify-content:space-between;gap:8px;font-size:clamp(.68rem,1.6vh,.85rem);opacity:.85;white-space:nowrap}
.ban .row span:first-child{overflow:hidden;text-overflow:ellipsis}
.ban .flag{position:static;background:none;padding:0;backdrop-filter:none;font-size:inherit;font-weight:800}.ban .flag.live{background:none;color:#ff7d92}
.hempty{align-self:center;font-weight:300;font-size:1.2rem;opacity:.8}
.hbar{position:absolute!important;left:0;right:0;bottom:0;height:clamp(40px,6.5vh,58px);display:flex;align-items:center;gap:clamp(14px,2.4vw,34px);padding:0 var(--lead);background:rgba(2,12,70,.65);border-top:1px solid rgba(255,255,255,.18);font-weight:300;font-size:clamp(.78rem,1.9vh,1.1rem)}
.hbar kbd{font:inherit;font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:0 8px;margin-right:8px}
.modebtn{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:15;font:inherit;font-size:.74rem;font-weight:800;color:#fff;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);opacity:.7;transition:opacity .2s}
.modebtn:hover{opacity:1}
@media(max-width:640px){.hbar span:not(:first-child){display:none}.hs-note,.hs-user{display:none}.htitle{left:calc(var(--lead) + var(--ht)*1.7 + 14px)}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div></div>

<div class="app">
  <header class="top">
    <div class="brand"><i>📡</i><span>Kestrel</span></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="sys">
      <div class="chips" id="chips" aria-label="Sport filter"></div>

  <div class="hbar"><span><kbd>Enter</kbd>Select</span><span><kbd>← →</kbd>Browse</span><span><kbd>↑ ↓</kbd>Move</span><span><kbd>M</kbd>Switch menu</span></div>
</div>

  <div class="sheet" id="sheet"></div>
</div>

<script src="config.js"></script>
<script>
const API='https://thedaddy.pk/api.php';
const ORIGIN='https://thedaddy.pk/';
const ICONS={
 football:'<circle cx="12" cy="12" r="9"/><path d="M12 8l3.5 2.5-1.3 4H9.8l-1.3-4z"/><path d="M12 8V3M15.5 10.5l5-1.5M14.2 14.5l3 4M9.8 14.5l-3 4M8.5 10.5l-5-1.5"/>',
 basketball:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6c3 3 3 10.8 0 12.8M18.4 5.6c-3 3-3 10.8 0 12.8"/>',
 tennis:'<circle cx="12" cy="12" r="9"/><path d="M5.5 5.5c4 3 4 10 0 13M18.5 5.5c-4 3-4 10 0 13"/>',
 cricket:'<path d="M15 3l6 6-9 9-6-6z"/><path d="M6 12l-3 6 3 3 6-3"/><circle cx="19" cy="19" r="2"/>',
 rugby:'<ellipse cx="12" cy="12" rx="10" ry="6" transform="rotate(-45 12 12)"/><path d="M8.5 15.5l7-7M10 10l4 4"/>',
 nfl:'<ellipse cx="12" cy="12" rx="10" ry="6" transform="rotate(-45 12 12)"/><path d="M9 15l6-6M10.5 10.5l3 3M8 12.5l3.5 3.5M12.5 8l3.5 3.5"/>',
 boxing:'<path d="M7 11V7a4 4 0 018 0v3h2a3 3 0 013 3v2a6 6 0 01-6 6h-4a3 3 0 01-3-3z"/><path d="M7 16h10"/>',
 mma:'<path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M9 9l6 6M15 9l-6 6"/>',
 racing:'<path d="M5 21V4M5 4h14l-2 4 2 4H5"/><path d="M9 4v8M13 4v8M5 8h14"/>',
 baseball:'<circle cx="12" cy="12" r="9"/><path d="M6.5 5c3 3 3 11 0 14M17.5 5c-3 3-3 11 0 14"/>',
 hockey:'<path d="M5 3l8 14h6"/><ellipse cx="17" cy="20" rx="4" ry="1.5"/>',
 golf:'<path d="M9 21V3l9 4-9 4"/><path d="M5 21h14"/>',
 darts:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 snooker:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>',
 all:'<path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M12 14v4M8 21h8M10 18h4"/>',
 default:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>'
};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]||ICONS.default}</svg>`;
/* real league marks from ESPN's CDN */
const LG=(f,i)=>`https://a.espn.cdn.espn.com/i/leaguelogos/soccer/500/${i}.png`,PRO=l=>`https://a.espn.cdn.espn.com/i/teamlogos/leagues/500/${l}.png`;
const LEAGUES=[[/premier league|epl|english premier/,LG(0,23)],[/la ?liga|spanish/,LG(0,15)],[/serie a|italian/,LG(0,12)],[/bundesliga|german/,LG(0,10)],
 [/ligue 1|french/,LG(0,9)],[/champions league|ucl/,LG(0,2)],[/europa league/,LG(0,2310)],[/\bmls\b|major league soccer/,LG(0,19)],
 [/\bnba\b/,PRO('nba')],[/\bnfl\b/,PRO('nfl')],[/\bmlb\b/,PRO('mlb')],[/\bnhl\b/,PRO('nhl')]];
const leagueLogo=e=>{const t=(e.cat+' '+e.name).toLowerCase();for(const[r,u]of LEAGUES)if(r.test(t))return u;return''};
const crests={},tcol={};const tcolOf=n=>{if(!n)return'';n=n.toLowerCase();if(tcol[n])return tcol[n];for(const k in tcol)if(k.includes(n)||n.includes(k))return tcol[k];return''};
const crestOf=n=>{n=n.toLowerCase();if(crests[n])return crests[n];for(const k in crests)if(k.includes(n)||n.includes(k))return crests[k];return''};
const SP={
  football:['football','Football','#19c37d','#0b7a55'],basketball:['basketball','Basketball','#ff9a3d','#e0501d'],
  tennis:['tennis','Tennis','#c9ea3a','#4fa828'],cricket:['cricket','Cricket','#3cc9b0','#1a7d9a'],
  rugby:['rugby','Rugby','#9a63ff','#4b2bb5'],boxing:['boxing','Boxing','#ff4f66','#a1163a'],
  mma:['mma','MMA','#ff7a45','#8e1d2c'],racing:['racing','Racing','#ff3d6e','#3a1c8f'],
  nfl:['nfl','NFL','#c98a4b','#6a3a1a'],baseball:['baseball','Baseball','#4f95ff','#1c3f9e'],
  hockey:['hockey','Hockey','#6fdcff','#2a74c8'],golf:['golf','Golf','#7fdc5f','#1f8a4a'],
  darts:['darts','Darts','#ff62d0','#6a2bd0'],snooker:['snooker','Snooker','#2fc069','#0b5a3a'],
  default:['default','Other','#5f70ff','#2a2f8f']
};
function sportOf(c){c=c.toLowerCase();
  if(/foot|soccer/.test(c)&&!/american/.test(c))return'football';
  if(/basket/.test(c))return'basketball';if(/tennis/.test(c))return'tennis';if(/cricket/.test(c))return'cricket';
  if(/rugby/.test(c))return'rugby';if(/box/.test(c))return'boxing';if(/mma|ufc|fight/.test(c))return'mma';
  if(/f1|formula|nascar|racing|motor|moto/.test(c))return'racing';if(/nfl|american/.test(c))return'nfl';
  if(/baseball|mlb/.test(c))return'baseball';if(/hockey|nhl/.test(c))return'hockey';if(/golf|pga/.test(c))return'golf';
  if(/darts/.test(c))return'darts';if(/snooker|billiard|pool/.test(c))return'snooker';return'default'}

const TABS=[['live','Live now'],['up','Up next'],['done','Finished'],['all','Everything']];
let events=[],tab=0,sport='all',fi=0,mode='tiles',panelEv=null,pi=0,scores={};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo=u=>!u?'':/^https?:/.test(u)?u:ORIGIN+u.replace(/^\//,'');
const SERVERS=['stream','cast','watch','plus','casting','player'];
let panelMode='list',srv=0,chIdx=0;
const stream=(id,k=srv)=>`${ORIGIN}${SERVERS[k]}/stream-${encodeURIComponent(id)}.php`;
const fmtT=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

/* times from the API are UK GMT; day headers look like "Friday 30th October 2026" */
function eventDate(time,header){
  const [h,m]=(time||'00:00').split(':').map(Number);
  const mt=/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\s+(\d{4})/.exec(header||'');
  if(mt){const mi=MONTHS.indexOf(mt[2].slice(0,3).toLowerCase());if(mi>=0)return new Date(Date.UTC(+mt[3],mi,+mt[1],h,m))}
  const n=new Date();return new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+(/tomorrow/i.test(header)?1:0),h,m))
}
function stat(e){const d=Date.now()-e.date;return d<0?'up':d<3*36e5?'live':'done'}
function dayLabel(d){const t=new Date(),k=x=>x.toDateString();
  if(k(d)===k(t))return'Today';const n=new Date(t);n.setDate(n.getDate()+1);
  if(k(d)===k(n))return'Tomorrow';return d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}

function parse(raw){
  const days=raw.data||raw,out=[];let id=0;
  for(const[hd,cats]of Object.entries(days||{})){
    if(!cats||typeof cats!=='object')continue;
    for(const[cat,list]of Object.entries(cats)){
      if(!Array.isArray(list))continue;
      for(const ev of list){
        const chs=[...(ev.channels||[]),...(ev.channels2||[])].filter(c=>c&&c.channel_id);
        if(!chs.length)continue;
        out.push({id:id++,name:ev.event||'Event',sport:sportOf(cat),cat,date:eventDate(ev.time,hd),chs})
      }
    }
  }
  return out.sort((a,b)=>a.date-b.date)
}
function demo(){
  const mk=(min,name,cat,chs)=>({id:0,name,cat,sport:sportOf(cat),date:new Date(Date.now()+min*6e4),chs:chs.map((n,i)=>({channel_name:n,channel_id:String(900+i),logo_url:''}))});
  return[
    mk(-55,'Arsenal vs Chelsea','Football',['Sky Sports Main','TNT Sports 1']),
    mk(-30,'Lakers vs Celtics','Basketball',['ESPN','NBA TV']),
    mk(-20,'Djokovic vs Alcaraz','Tennis',['Eurosport 1']),
    mk(35,'Real Madrid vs Barcelona','Football',['Movistar','ESPN 2','Sky Sports 2']),
    mk(90,'Fury vs Usyk','Boxing',['DAZN 1']),
    mk(150,'Las Vegas Grand Prix','Formula 1',['Sky F1']),
    mk(260,'England vs Australia','Cricket',['Sky Cricket']),
    mk(1500,'Man City vs Tottenham','Football',['Sky Sports Premier League']),
    mk(-400,'Bayern vs PSG','Football',['TNT Sports 2'])
  ].map((e,i)=>({...e,id:i}))
}

/* best-effort real scores from ESPN's public scoreboards; matched by team name */
const ESPN=[['football','soccer/eng.1'],['football','soccer/esp.1'],['football','soccer/ita.1'],['football','soccer/ger.1'],['football','soccer/fra.1'],['football','soccer/uefa.champions'],['football','soccer/usa.1'],['basketball','basketball/nba'],['basketball','basketball/mens-college-basketball'],['nfl','football/college-football'],['nfl','football/nfl'],['baseball','baseball/mlb'],['hockey','hockey/nhl']];
async function loadScores(){
  for(const[k,p]of ESPN){
    try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${p}/scoreboard`);if(!r.ok)continue;
      const j=await r.json();
      for(const ev of j.events||[]){const c=ev.competitions?.[0]?.competitors||[];if(c.length<2)continue;
        const a=c[0].team.shortDisplayName.toLowerCase(),b=c[1].team.shortDisplayName.toLowerCase();
        for(const x of c){const L=x.team.logo;const C=x.team.color?'#'+x.team.color:'';if(L)for(const n of[x.team.shortDisplayName,x.team.displayName,x.team.name])if(n){crests[n.toLowerCase()]=L;if(C)tcol[n.toLowerCase()]=C}}
        scores[a+'|'+b]=`${c[0].score} - ${c[1].score}`;scores[b+'|'+a]=`${c[1].score} - ${c[0].score}`}
    }catch(e){}
  }
  draw(true)
}
function teams(n){const m=/^(.+?)\s+(?:vs?\.?|at)\s+(.+?)(?:\s*[-–(].*)?$/i.exec(n);return m?[m[1].trim(),m[2].trim()]:null}
function scoreOf(e){if(stat(e)==='done'&&0)return null;const t=teams(e.name);if(!t)return null;
  const a=t[0].toLowerCase(),b=t[1].toLowerCase();
  for(const k in scores){const[x,y]=k.split('|');if((a.includes(x)||x.includes(a))&&(b.includes(y)||y.includes(b)))return scores[k]}return null}

/* views */
function list(){
  const key=TABS[tab][0];
  const pin=e=>adminData.pinned[evKey(e)]?0:1;
  return events.filter(e=>!adminData.hidden[evKey(e)]&&(sport==='all'||e.sport===sport)&&(key==='all'||stat(e)===key))
    .sort((a,b)=>pin(a)-pin(b)||(key==='done'?b.date-a.date:a.date-b.date))
}
function drawChrome(){
  $('tabs').innerHTML=TABS.map(([k,l],i)=>{
    const n=events.filter(e=>(sport==='all'||e.sport===sport)&&(k==='all'||stat(e)===k)).length;
    return`<button class="tab${i===tab?' on':''}${mode==='tabs'&&i===tab?' kb':''}" data-i="${i}">${l}<small>${n}</small></button>`}).join('');
  const have=[...new Set(events.map(e=>e.sport))];
  $('chips').innerHTML=`<button class="chip${sport==='all'?' on':''}" data-s="all" title="All sports">${ic('all')}</button>`+
    have.map(k=>`<button class="chip${sport===k?' on':''}" data-s="${k}" title="${esc(SP[k][1])}">${ic(k)}</button>`).join('')
}
function artHTML(e,t,sc){
  const a=t&&crestOf(t[0]),b=t&&crestOf(t[1]);
  if(a&&b)return`<img class="cr" src="${esc(a)}" alt=""><i>${sc?esc(sc):'VS'}</i><img class="cr" src="${esc(b)}" alt="">`;
  const l=leagueLogo(e);
  return l?`<img class="cr big" src="${esc(l)}" alt="" onerror="this.outerHTML=this.dataset.fb" data-fb='<div class="emo">${ic(e.sport).replace(/'/g,"&#39;")}</div>'>`:`<div class="emo">${ic(e.sport)}</div>`}
function bannerBG(e,t){
  const s=SP[e.sport],ca=t&&tcol[(t[0]||'').toLowerCase()]||tcolOf(t&&t[0]),cb=t&&tcolOf(t[1]);
  const A=ca&&cb?ca:s[2],B=ca&&cb?cb:s[3];
  return`linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.5)),linear-gradient(90deg,${A},${B})`}
function tileHTML(e,i){
  const st=stat(e),t=teams(e.name),sc=st!=='up'?scoreOf(e):null;
  const when=st==='live'?'<span class="flag live">LIVE</span>':st==='up'?`<span class="flag">${esc(dayLabel(e.date))} · ${esc(fmtT(e.date))}</span>`:'<span class="flag">Full time</span>';
  return`<div class="tile s-${e.sport}" data-i="${i}" role="button" tabindex="-1" aria-label="${esc(e.name)}"><div class="art" style="background:${bannerBG(e,t)}">${artHTML(e,t,sc)}</div>
    <div class="info"><div class="nm">${esc(e.name)}</div><div class="row"><span>${esc(e.cat||SP[e.sport][1])}${viewers[evKey(e)]?` · 👁 ${viewers[evKey(e)]}`:''}</span>${when}</div></div></div>`
}
function draw(keep){
  if(home)homeDraw(keep);
  const L=list();if(!keep)fi=0;if(fi>=L.length)fi=Math.max(0,L.length-1);
  drawChrome();
  const rail=$('rail');
  if(!L.length){rail.innerHTML='';$('detail').innerHTML=`<div class="empty">Nothing here right now. Try another section or sport.</div>`;setColors('#5f70ff','#2a2f8f');return}
  rail.innerHTML=L.map(tileHTML).join('');
  focus(fi)
}
function setColors(a,b){const r=document.documentElement.style;r.setProperty('--c1',a);r.setProperty('--c2',b)}
function focus(i){
  const L=list();if(!L.length)return;fi=Math.max(0,Math.min(L.length-1,i));
  const tiles=[...$('rail').children];tiles.forEach((t,k)=>t.classList.toggle('f',k===fi));
  const e=L[fi],s=SP[e.sport],st=stat(e),sc=st!=='up'?scoreOf(e):null;
  setColors(s[2],s[3]);
  const t=tiles[fi],lead=Math.max(16,innerWidth*.06);
  $('rail').style.transform=`translateX(${lead-t.offsetLeft}px)`;
  document.documentElement.style.setProperty('--lead',(lead+(t.offsetWidth*.1))+'px');
  $('detail').innerHTML=`<h1>${esc(e.name)}</h1>
    <div class="meta">${st==='live'?'<span class="pill live">● Live</span>':st==='done'?'<span class="pill">Full time</span>':''}
      <span class="pill ico">${ic(e.sport)} ${esc(s[1])}</span><span class="pill">${esc(dayLabel(e.date))} · ${esc(fmtT(e.date))}</span>
      ${sc?`<span class="pill">Score ${esc(sc)}</span>`:''}<span class="pill">${e.chs.length} channel${e.chs.length>1?'s':''}</span></div>
    <div class="actions"><button class="play" id="playBtn">▶ Pick a stream</button><span class="ghost">${fi+1} of ${L.length}</span></div>`;
  $('playBtn').onclick=()=>openPanel(e)
}

/* backend: Firebase Realtime Database over REST (setup in BACKEND.md). Without config.js, likes stay on this device only. */
const CFG=window.KESTREL||{},DBURL=(CFG.databaseURL||'').replace(/\/$/,''),LIVE_BE=!!DBURL;
let me='';try{me=localStorage.kid||(localStorage.kid=Math.random().toString(36).slice(2,12)+Date.now().toString(36))}catch(_){me='x'+Math.random().toString(36).slice(2)}
let idToken='',beOk=true,adminData={hidden:{},pinned:{},banner:''},viewers={};
try{idToken=sessionStorage.kt||''}catch(_){}
const evKey=e=>e.k||(e.k=(()=>{let h=0;const s=e.name+'|'+e.date.getTime();for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)})());
async function be(path,method='GET',body){
  beOk=false;if(!LIVE_BE)return null;
  try{const q=idToken&&method!=='GET'?'?auth='+idToken:'';
    const r=await fetch(`${DBURL}/${path}.json${q}`,{method,body:body===undefined?undefined:JSON.stringify(body),keepalive:method!=='GET'});
    beOk=r.ok;return r.ok?await r.json():null}catch(_){return null}}

/* anonymous likes / dislikes: one vote per browser id */
const myVote=k=>{try{return+(localStorage['v_'+k]||0)}catch(_){return 0}};
async function votes(k){
  let up=0,down=0;
  if(LIVE_BE){const o=await be('votes/'+k)||{};for(const u in o){if(o[u]===1)up++;else if(o[u]===-1)down++}}
  else{try{const o=JSON.parse(localStorage['lv_'+k]||'{}');up=o.up||0;down=o.down||0}catch(_){}}
  return{up,down}}
async function vote(k,v){
  const cur=myVote(k),nv=cur===v?0:v;
  try{nv?localStorage['v_'+k]=nv:localStorage.removeItem('v_'+k)}catch(_){}
  if(LIVE_BE)await be(`votes/${k}/${me}`,nv?'PUT':'DELETE',nv||undefined);
  else{try{const o=JSON.parse(localStorage['lv_'+k]||'{}');
    if(cur===1)o.up=Math.max(0,(o.up||0)-1);if(cur===-1)o.down=Math.max(0,(o.down||0)-1);
    if(nv===1)o.up=(o.up||0)+1;if(nv===-1)o.down=(o.down||0)+1;localStorage['lv_'+k]=JSON.stringify(o)}catch(_){}}
  return nv}

/* viewer counts: each open player writes a heartbeat; anything older than 50s is gone */
let pTimer=0,pKey='';
const beat=()=>pKey?be(`presence/${pKey}/${me}`,'PUT',Date.now()):null;
function watching(k){stopWatching();pKey=k;Promise.resolve(beat()).then(refreshViewers);pTimer=setInterval(()=>{beat();refreshViewers()},20000)}
function stopWatching(){if(pTimer){clearInterval(pTimer);pTimer=0}if(pKey){be(`presence/${pKey}/${me}`,'DELETE');pKey=''}}
async function refreshViewers(){
  const o=await be('presence');if(!o)return;const now=Date.now(),v={};
  for(const k in o){let n=0;for(const u in o[k])if(now-o[k][u]<50000)n++;if(n)v[k]=n}
  const ch=JSON.stringify(v)!==JSON.stringify(viewers);viewers=v;
  if(ch){if(panelEv&&panelMode==='player')paintViewers();draw(true)}}
addEventListener('pagehide',()=>{if(pKey&&LIVE_BE)fetch(`${DBURL}/presence/${pKey}/${me}.json`,{method:'DELETE',keepalive:true}).catch(()=>{})});

/* admin-set options: hidden events, pinned events, announcement banner */
async function loadAdmin(){
  const a=await be('admin');if(a)adminData={hidden:a.hidden||{},pinned:a.pinned||{},banner:a.banner||''};
  paintBanner();draw(true)}
function paintBanner(){const b=$('banner');b.textContent=adminData.banner;b.hidden=!adminData.banner}

async function signIn(email,pw){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(CFG.apiKey||'')}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message||'Sign-in failed').replace(/_/g,' ').toLowerCase());
  idToken=j.idToken;try{sessionStorage.kt=idToken}catch(_){}}
async function openAdmin(msg){
  let ov=$('admin');if(!ov){ov=document.createElement('div');ov.id='admin';ov.className='adm';document.body.appendChild(ov);
    ov.addEventListener('click',admClick);ov.addEventListener('submit',admSubmit)}
  ov.classList.add('open');
  if(!LIVE_BE){ov.innerHTML=`<div class="adm-box"><button class="adm-x" data-a="close">✕</button><h2>Admin</h2>
    <p class="adm-note">The shared backend isn't set up yet, so likes stay on this device and viewer counts are off. Fill in <b>config.js</b> using the steps in <b>BACKEND.md</b> to turn on viewer counts and the admin tools.</p></div>`;return}
  if(!idToken){ov.innerHTML=`<form class="adm-box"><button type="button" class="adm-x" data-a="close">✕</button><h2>Admin sign-in</h2>
    ${msg?`<p class="adm-err">${esc(msg)}</p>`:''}
    <input name="e" type="email" placeholder="Email" autocomplete="username" required><input name="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="play" type="submit">Sign in</button></form>`;return}
  ov.innerHTML=`<div class="adm-box"><p class="ghost">Loading…</p></div>`;
  const vs=await be('votes')||{};await refreshViewers();await loadAdmin();
  const tally=k=>{let u=0,d=0;for(const x in vs[k]||{}){if(vs[k][x]===1)u++;else d++}return[u,d]};
  const rows=events.slice().sort((a,b)=>a.date-b.date).map(e=>{const k=evKey(e),[u,d]=tally(k);
    return`<div class="adm-row${adminData.hidden[k]?' off':''}"><div class="adm-n"><b>${esc(e.name)}</b><small>${esc(e.cat)} · ${esc(dayLabel(e.date))} ${esc(fmtT(e.date))}</small></div>
      <span class="adm-s">👁 ${viewers[k]||0}</span><span class="adm-s">👍 ${u}</span><span class="adm-s">👎 ${d}</span>
      <button class="mini${adminData.pinned[k]?' on':''}" data-a="pin" data-k="${k}">${adminData.pinned[k]?'Pinned':'Pin'}</button>
      <button class="mini${adminData.hidden[k]?' on':''}" data-a="hide" data-k="${k}">${adminData.hidden[k]?'Hidden':'Hide'}</button>
      <button class="mini" data-a="reset" data-k="${k}">Reset votes</button></div>`}).join('');
  ov.innerHTML=`<div class="adm-box wide"><button class="adm-x" data-a="close">✕</button><h2>Admin</h2>
    ${msg?`<p class="adm-err">${esc(msg)}</p>`:''}
    <form class="adm-bn" data-f="banner"><input name="b" value="${esc(adminData.banner)}" maxlength="140" placeholder="Announcement banner shown to everyone (empty to remove)"><button class="mini on" type="submit">Save banner</button></form>
    <div class="adm-list">${rows||'<p class="adm-note">No events.</p>'}</div>
    <button class="mini" data-a="out">Sign out</button></div>`}
async function admWrite(path,method,body){await be(path,method,body);if(!beOk){idToken='';try{delete sessionStorage.kt}catch(_){}return openAdmin('Session expired or this account is not the admin. Sign in again.')}await loadAdmin();openAdmin()}
function admClick(ev){
  const b=ev.target.closest('[data-a]');if(!b){if(ev.target===$('admin'))$('admin').classList.remove('open');return}
  const a=b.dataset.a,k=b.dataset.k;
  if(a==='close')$('admin').classList.remove('open');
  else if(a==='out'){idToken='';try{delete sessionStorage.kt}catch(_){}openAdmin()}
  else if(a==='pin')adminData.pinned[k]?admWrite('admin/pinned/'+k,'DELETE'):admWrite('admin/pinned/'+k,'PUT',true);
  else if(a==='hide')adminData.hidden[k]?admWrite('admin/hidden/'+k,'DELETE'):admWrite('admin/hidden/'+k,'PUT',true);
  else if(a==='reset')admWrite('votes/'+k,'DELETE')}
async function admSubmit(ev){
  ev.preventDefault();const f=ev.target;
  if(f.dataset.f==='banner'){const v=f.b.value.trim();return admWrite('admin/banner',v?'PUT':'DELETE',v||undefined)}
  try{await signIn(f.e.value,f.p.value);openAdmin()}catch(err){openAdmin(err.message)}}

let home=false,hi=-1,hs=0,hMode='row';
try{home=localStorage.kview!=='classic'}catch(_){home=true}
function setView(h){home=h;try{localStorage.kview=h?'home':'classic'}catch(_){}

const visEv=()=>events.filter(e=>!adminData.hidden[evKey(e)]);
function hItems(){const v=visEv(),c=k=>v.filter(e=>stat(e)===k).length,sp={};
  const out=[['live','Live now','live',c('live')],['up','Up next','up',c('up')],['done','Finished','done',c('done')],['all','Everything','all',v.length]];
  v.forEach(e=>sp[e.sport]=(sp[e.sport]||0)+1);
  Object.keys(sp).sort((a,b)=>sp[b]-sp[a]).forEach(k=>out.push(['sp:'+k,SP[k][1],k,sp[k]]));return out}
function hEvents(it){const v=visEv().filter(e=>it[0].startsWith('sp:')?e.sport===it[0].slice(3):it[0]==='all'||stat(e)===it[0]);
  const rank={live:0,up:1,done:2};
  return v.sort((a,b)=>(adminData.pinned[evKey(a)]?0:1)-(adminData.pinned[evKey(b)]?0:1)
    ||(it[0]==='done'?b.date-a.date:(rank[stat(a)]-rank[stat(b)])||(stat(a)==='done'?b.date-a.date:a.date-b.date))).slice(0,40)}
function banHTML(e,i){
  const st=stat(e),t=teams(e.name),sc=st!=='up'?scoreOf(e):null;
  const when=st==='live'?'<span class="flag live">LIVE</span>':st==='up'?`<span class="flag">${esc(dayLabel(e.date))} · ${esc(fmtT(e.date))}</span>`:'<span class="flag">Full time</span>';
  return`<div class="ban${i===hs&&hMode==='strip'?' f':''}" data-i="${i}" role="button" aria-label="${esc(e.name)}"><div class="art" style="background:${bannerBG(e,t)}">${artHTML(e,t,sc)}</div>
    <div class="info"><div class="nm">${esc(e.name)}</div><div class="row"><span>${esc(e.cat||SP[e.sport][1])}${viewers[evKey(e)]?` · 👁 ${viewers[evKey(e)]}`:''}</span>${when}</div></div></div>`}
function homeDraw(keep){
  const items=hItems();
  if(hi<0||!keep){hi=items[0][3]?0:(items[1][3]?1:3)}
  hi=Math.min(hi,items.length-1);
  const it=items[hi],lst=hEvents(it);hs=Math.min(hs,Math.max(0,lst.length-1));

    <div class="hs-note">${live?`<i class="dot"></i>${live} live now`:'Nothing live right now'}</div>
    ${LIVE_BE&&tw?`<div class="hs-note">👁 ${tw} watching</div>`:''}
    ${adminData.banner?`<div class="hs-note">📣 ${esc(adminData.banner)}</div>`:''}
    <div class="hs-r"><button class="admbtn" id="hAdm">Admin</button><span class="hs-user"><span class="av">${ic('default')}</span>Guest</span><span class="hs-clock">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}</span></div>`;
  $('hAdm').onclick=()=>openAdmin();

    return`<div class="ht${f?' f':''}${f&&hMode==='strip'?' dim':''} k-${x[0].replace(':','-')}" data-i="${i}" style="${s?`--a:${s[2]};--b:${s[3]}`:''}"><div class="hi">${ic(x[2])}</div>
      <div class="hl"><b>${esc(x[1])}</b><small>${x[3]} event${x[3]===1?'':'s'}</small></div></div>`}).join('');
  const small=ht.querySelector('.ht:not(.f)'),w=small?small.offsetWidth+parseFloat(getComputedStyle(ht).columnGap||14):160;
  ht.style.transform=`translateX(${-hi*w}px)`;

  $('hStrip').innerHTML=lst.length?lst.map(banHTML).join(''):`<div class="hempty">Nothing in ${esc(it[1])} right now. Browse another tile.</div>`;
  const f=$('hStrip').querySelector('.ban.f');if(f)f.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('hStrip').dataset.n=lst.length;$('hStrip').__l=lst;$('hStrip').__sp=sp;
}
function homeAct(a){
  const n=hItems().length,len=+$('hStrip').dataset.n||0;
  if(hMode==='row'){
    if(a==='left'&&hi>0){hi--;hs=0;homeDraw(true)}
    else if(a==='right'&&hi<n-1){hi++;hs=0;homeDraw(true)}
    else if((a==='down'||a==='ok')&&len){hMode='strip';homeDraw(true)}
  }else{
    if(a==='left'&&hs>0){hs--;homeDraw(true)}
    else if(a==='right'&&hs<len-1){hs++;homeDraw(true)}
    else if(a==='up'||a==='back'){hMode='row';homeDraw(true)}
    else if(a==='ok'){const e=$('hStrip').__l[hs];if(e)openPanel(e)}
  }
}

        <div class="lab">Channel</div><div class="chipset">${e.chs.map((x,j)=>`<button class="mini${j===i?' on':''}" data-k="${j}">${esc(x.channel_name)}</button>`).join('')}</div>
        <div class="lab">Server — try another if it won't load</div><div class="chipset">${SERVERS.map((n,j)=>`<button class="mini${j===srv?' on':''}" data-srv="${j}">${j+1}</button>`).join('')}
          <a class="mini" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open in tab ↗</a></div>
      </div>
    </div>
    <div class="pstage"><div class="screen-msg">Loading ${esc(c.channel_name)}…</div>
      <iframe id="frame" src="${esc(url)}" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" title="${esc(e.name)}"></iframe>
      <button class="phandle" id="phandle" title="Show bar">⌄</button></div></div>`;
  paintVotes(k);paintViewers();watching(k)
}
async function paintVotes(k){
  const v=await votes(k);if(!panelEv||evKey(panelEv)!==k||!$('lkN'))return;
  const m=myVote(k);$('lkN').textContent=v.up;$('dlN').textContent=v.down;
  $('lk').classList.toggle('on',m===1);$('dl').classList.toggle('on',m===-1)}
function paintViewers(){const w=$('vw');if(!w||!panelEv)return;
  w.textContent=LIVE_BE?`👁 ${Math.max(1,viewers[evKey(panelEv)]||0)} watching`:''}
$('sheet').addEventListener('click',async ev=>{
  if(panelMode!=='player'||!panelEv)return;const t=ev.target,k=evKey(panelEv),pv=$('pv');
  if(t.closest('#pvBack'))closePanel();
  else if(t.closest('#pmenuBtn'))$('pmenu').hidden=!$('pmenu').hidden;
  else if(t.closest('#fsBtn')){document.fullscreenElement?document.exitFullscreen():pv.requestFullscreen?.().catch(()=>{})}
  else if(t.closest('#minBtn')||t.closest('#phandle'))pv.classList.toggle('min');
  else if(t.closest('#lk')||t.closest('#dl')){await vote(k,t.closest('#lk')?1:-1);paintVotes(k)}
});
$('sheet').addEventListener('click',ev=>{
  const a=ev.target.closest('.ch');
  if(a&&panelMode==='list'&&ev.button===0&&!ev.metaKey&&!ev.ctrlKey&&!ev.shiftKey){ev.preventDefault();playChannel(+a.dataset.i);return}
  const m=ev.target.closest('.mini[data-k]');if(m){playChannel(+m.dataset.k);return}
  const v=ev.target.closest('.mini[data-srv]');if(v){srv=+v.dataset.srv;playChannel(chIdx)}
});
function pFocus(i){const c=[...$('chs').children];pi=(i+c.length)%c.length;c.forEach((x,k)=>x.classList.toggle('f',k===pi));c[pi].focus({preventScroll:true})}

/* input */
function act(a){
  if(!panelEv&&home)return homeAct(a);
  if(panelEv){
    if(panelMode==='player'){if(a==='back'&&!document.fullscreenElement)closePanel();return}
    if(a==='back')closePanel();
    else if(a==='left'||a==='up')pFocus(pi-1);
    else if(a==='right'||a==='down')pFocus(pi+1);
    else if(a==='ok')$('chs').children[pi].click();
    return
  }
  if(mode==='tabs'){
    if(a==='left'){tab=(tab+TABS.length-1)%TABS.length;draw()}
    else if(a==='right'){tab=(tab+1)%TABS.length;draw()}
    else if(a==='down'||a==='ok'){mode='tiles';drawChrome()}
    return
  }
  if(a==='left')focus(fi-1);
  else if(a==='right')focus(fi+1);
  else if(a==='up'){mode='tabs';drawChrome()}
  else if(a==='ok'){const e=list()[fi];if(e)openPanel(e)}
  else if(a==='sport')cycleSport()
}
function cycleSport(){const ks=['all',...new Set(events.map(e=>e.sport))];sport=ks[(ks.indexOf(sport)+1)%ks.length];draw()}
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'ok',' ':'ok',Escape:'back',Backspace:'back',s:'sport',S:'sport'};
addEventListener('keydown',ev=>{const a=KEYS[ev.key];if(!a)return;
  if(panelEv&&ev.key==='Enter'&&document.activeElement?.classList.contains('ch')){return}
  if(ev.target.closest&&ev.target.closest('#playBtn')&&a==='ok'&&!panelEv)return;
  ev.preventDefault();act(a)});

$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=+b.dataset.i;mode='tiles';draw()});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;sport=b.dataset.s;draw()});
$('rail').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;const i=+t.dataset.i;
  if(i===fi)openPanel(list()[i]);else focus(i)});
$('panel').addEventListener('click',e=>{if(e.target.id==='panel')closePanel()});
$('rail').addEventListener('wheel',e=>{e.preventDefault();if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<8)return;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(!wheelLock){wheelLock=true;focus(fi+(d>0?1:-1));setTimeout(()=>wheelLock=false,140)}},{passive:false});
let wheelLock=false,tx=0;
$('stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)focus(fi+(d<0?1:-1))},{passive:true});
addEventListener('resize',()=>focus(fi));

/* gamepad: d-pad or left stick moves, A selects, B goes back */
let gpHeld={};
function pad(){
  const g=[...(navigator.getGamepads?.()||[])].find(Boolean);
  if(g){
    const ax=g.axes[0]||0,ay=g.axes[1]||0,b=g.buttons;
    const st={left:b[14]?.pressed||ax<-.6,right:b[15]?.pressed||ax>.6,up:b[12]?.pressed||ay<-.6,down:b[13]?.pressed||ay>.6,ok:b[0]?.pressed,back:b[1]?.pressed};
    for(const k in st){if(st[k]&&!gpHeld[k])act(k);gpHeld[k]=st[k]}
  }
  requestAnimationFrame(pad)
}
requestAnimationFrame(pad);

setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);
$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
setInterval(()=>{if(!panelEv)draw(true)},60000);

(async function init(){
  try{const r=await fetch(`${API}?endpoint=schedule`);if(!r.ok)throw 0;events=parse(await r.json());if(!events.length)throw 0}
  catch(e){events=demo()}
  tab=events.some(e=>stat(e)==='live')?0:1;
  draw();loadScores();
  $('admBtn').onclick=()=>openAdmin();
  if(LIVE_BE){loadAdmin();refreshViewers();setInterval(loadAdmin,60000);setInterval(()=>{if(!pKey)refreshViewers()},30000)}
})();
</script>
