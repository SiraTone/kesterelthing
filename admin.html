<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kestrel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- ============================================================
  FIREBASE CONFIG — same as watch.html
============================================================ -->
<script>
var FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT.firebaseapp.com",
  databaseURL:       "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId:         "YOUR_PROJECT",
  storageBucket:     "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};

/* Admin password — change this! */
var ADMIN_PASSWORD = 'kestrel-admin';
/* ----------------------------------------------------------- */
</script>

<style>
:root {
  --bg: #0d0618; --surface: #170a28; --raise: #20103a; --card: #1a0c2e;
  --line: #3a1f5e; --text: #fff4fb; --muted: #b79bd0; --subtle: #7a5ea0;
  --accent: #ff4fa3; --on-accent: #1a0210; --live: #ff2e4d; --danger: #ff5c5c;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box }
body { background: linear-gradient(180deg,#0d0618 0%,#2a0a4a 45%,#5a1250 75%,#ff6a3d22 100%) fixed, var(--bg) !important }
.brand, h1, h2 { font-family: "Anton", "Schibsted Grotesk", sans-serif !important; text-transform: uppercase; letter-spacing: .04em !important; font-weight: 400 !important;
  background: linear-gradient(90deg,#ff8a3d,#ff4fa3 55%,#b45cff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
.brand-dot { -webkit-text-fill-color: #2de2e6 }
html, body { margin: 0; min-height: 100dvh }
body {
  background: var(--bg); color: var(--text);
  font: 400 14px/1.6 "Schibsted Grotesk", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none }
button { font-family: inherit; cursor: pointer }
input { font-family: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px }

/* ── login ── */
.login-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh; padding: 24px;
}
.login-card {
  width: 100%; max-width: 380px; background: var(--card);
  border: 1px solid var(--line); border-radius: 20px; padding: 36px 32px;
}
.login-brand { font: 800 24px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -.05em; margin-bottom: 4px }
.login-brand em { font-style: normal; color: var(--accent) }
.login-sub { color: var(--muted); font-size: 13px; margin-bottom: 28px }
.login-label { font: 600 12px "Schibsted Grotesk", sans-serif; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px }
.login-input {
  width: 100%; padding: 11px 14px; background: var(--raise); border: 1px solid var(--line);
  border-radius: 10px; color: var(--text); font: 400 14px "Schibsted Grotesk", sans-serif;
  outline: none; transition: border-color .15s;
}
.login-input:focus { border-color: rgba(255,79,163,.5) }
.login-btn {
  width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; border: none;
  background: var(--accent); color: var(--on-accent); font: 700 14px "Schibsted Grotesk", sans-serif;
  transition: opacity .15s;
}
.login-btn:hover { opacity: .85 }
.login-err { color: var(--danger); font-size: 13px; margin-top: 8px; display: none }

/* ── dashboard ── */
#dashboard { display: none }
header {
  background: rgba(13,6,24,.9); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40;
}
.header-inner {
  display: flex; align-items: center; gap: 16px;
  height: 54px; max-width: 1200px; margin: 0 auto; padding: 0 24px;
}
.brand { font: 800 20px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -.05em }
.brand em { font-style: normal; color: var(--accent) }
.h-badge {
  font: 600 11px "Schibsted Grotesk", sans-serif; letter-spacing: .06em; text-transform: uppercase;
  background: rgba(255,79,163,.12); color: var(--accent); border: 1px solid rgba(255,79,163,.25);
  padding: 3px 9px; border-radius: 5px;
}
.logout-btn {
  margin-left: auto; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 600 12px "Schibsted Grotesk", sans-serif;
  transition: all .15s;
}
.logout-btn:hover { border-color: var(--muted); color: var(--text) }

.page { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px }

/* ── stats ── */
.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 28px }
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px }
.stat-value { font: 800 28px/1 "Schibsted Grotesk", sans-serif; letter-spacing: -.04em; margin-bottom: 4px }
.stat-value.green { color: var(--accent) }
.stat-value.red { color: var(--live) }
.stat-label { font: 500 12px "JetBrains Mono", monospace; color: var(--muted) }

/* ── panels ── */
.panels { display: grid; grid-template-columns: 1fr 320px; gap: 20px }
@media(max-width:900px){.panels{grid-template-columns:1fr;}}

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.panel-title { font: 700 14px "Schibsted Grotesk", sans-serif }
.panel-sub { font: 400 11px "JetBrains Mono", monospace; color: var(--subtle) }
.panel-refresh {
  padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: 500 11px "Schibsted Grotesk", sans-serif; transition: all .15s;
}
.panel-refresh:hover { border-color: var(--muted); color: var(--text) }

/* message list */
.msg-list { max-height: 520px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent }
.msg-list::-webkit-scrollbar { width: 4px }
.msg-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px }
.msg-row {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 18px;
  border-bottom: 1px solid var(--line); transition: background .1s;
}
.msg-row:last-child { border-bottom: none }
.msg-row:hover { background: var(--raise) }
.msg-row-user { font: 700 12px "Schibsted Grotesk", sans-serif; color: var(--accent); min-width: 100px; flex: none }
.msg-row-stream { font: 400 10px "JetBrains Mono", monospace; color: var(--subtle); margin-top: 2px }
.msg-row-text { flex: 1; font-size: 13px; word-break: break-word; min-width: 0 }
.msg-row-time { font: 400 10px "JetBrains Mono", monospace; color: var(--subtle); flex: none }
.msg-row-actions { display: flex; gap: 6px; flex: none }
.del-btn, .ban-btn {
  padding: 3px 9px; border-radius: 5px; font: 600 11px "Schibsted Grotesk", sans-serif;
  border: 1px solid; transition: all .15s;
}
.del-btn { border-color: rgba(255,92,92,.3); color: var(--danger); background: rgba(255,92,92,.06) }
.del-btn:hover { border-color: var(--danger); background: rgba(255,92,92,.15) }
.ban-btn { border-color: var(--line); color: var(--muted); background: transparent }
.ban-btn:hover { border-color: var(--muted); color: var(--text) }
.ban-btn.banned { border-color: rgba(255,92,92,.4); color: var(--danger); background: rgba(255,92,92,.08) }
.empty-state { padding: 40px; text-align: center; color: var(--subtle); font-size: 13px }

/* banned users */
.banned-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px }
.banned-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--raise); border-radius: 9px; border: 1px solid var(--line);
}
.banned-name { font: 700 13px "Schibsted Grotesk", sans-serif; color: var(--danger) }
.unban-btn {
  padding: 3px 10px; border-radius: 5px; font: 600 11px "Schibsted Grotesk", sans-serif;
  border: 1px solid var(--line); background: transparent; color: var(--muted); transition: all .15s;
}
.unban-btn:hover { border-color: var(--accent); color: var(--accent) }
.no-firebase {
  margin: 20px; padding: 20px; background: var(--raise); border: 1px solid var(--line);
  border-radius: 12px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7;
}
.no-firebase code { font-size: 12px; color: var(--accent); font-family: "JetBrains Mono", monospace }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important } }
</style>
</head>
<body>

<!-- login -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-brand">k<em>&middot;</em>strel</div>
    <div class="login-sub">Admin Panel</div>
    <div class="login-label">Password</div>
    <input class="login-input" type="password" id="pw-input" placeholder="Enter admin password" autocomplete="current-password">
    <button class="login-btn" id="login-btn">Sign in</button>
    <div class="login-err" id="login-err">Incorrect password.</div>
  </div>
</div>

<!-- dashboard -->
<div id="dashboard">
  <header>
    <div class="header-inner">
      <a class="brand" href="/">k<em>&middot;</em>strel</a>
      <span class="h-badge">Admin</span>
      <a href="/" style="font:500 12px 'Schibsted Grotesk',sans-serif;color:var(--muted);margin-left:10px">← Back to site</a>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </header>

  <div class="page">
    <!-- stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value green" id="stat-live">—</div>
        <div class="stat-label">live streams</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-viewers">—</div>
        <div class="stat-label">viewers now</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-msgs">—</div>
        <div class="stat-label">messages loaded</div>
      </div>
      <div class="stat-card">
        <div class="stat-value red" id="stat-banned">—</div>
        <div class="stat-label">banned users</div>
      </div>
    </div>

    <div class="panels">
      <!-- messages panel -->
      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Recent Messages</div>
            <div class="panel-sub" id="msg-sub">all streams</div>
          </div>
          <button class="panel-refresh" id="refresh-msgs">Refresh</button>
        </div>
        <div class="msg-list" id="msg-list">
          <div class="empty-state" id="msgs-empty">Loading messages…</div>
        </div>
      </div>

      <!-- banned users -->
      <div class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Banned Users</div>
            <div class="panel-sub" id="ban-sub">0 banned</div>
          </div>
        </div>
        <div class="banned-list" id="banned-list">
          <div class="empty-state">No banned users.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
(function () {
  var API = 'https://streamfree.top/api/v1';

  // ── auth ──
  var pwInput = document.getElementById('pw-input');
  var loginBtn = document.getElementById('login-btn');
  var loginErr = document.getElementById('login-err');
  var loginWrap = document.getElementById('login-wrap');
  var dashboard = document.getElementById('dashboard');
  var logoutBtn = document.getElementById('logout-btn');

  function doLogin() {
    if (pwInput.value === ADMIN_PASSWORD) {
      loginWrap.style.display = 'none';
      dashboard.style.display = 'block';
      initDashboard();
    } else {
      loginErr.style.display = 'block';
      pwInput.value = '';
    }
  }
  loginBtn.addEventListener('click', doLogin);
  pwInput.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  logoutBtn.addEventListener('click', function(){
    dashboard.style.display='none'; loginWrap.style.display='flex'; pwInput.value='';
  });

  // ── Firebase ──
  var FIREBASE_READY = false;
  var db = null;
  try {
    if (typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.includes('YOUR_PROJECT')) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      FIREBASE_READY = true;
    }
  } catch(e) { console.warn('Firebase init failed', e); }

  function slugify(str){return(str||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
  function fmtTime(ts){var d=new Date(ts);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});}

  var allMessages = [];
  var bannedUsers = {};
  var streamNames = {};

  function initDashboard() {
    if (!FIREBASE_READY || !db) {
      document.getElementById('msg-list').innerHTML='<div class="no-firebase">Firebase not configured.<br>Add your config to <code>admin.html</code> and <code>watch.html</code>.</div>';
      document.getElementById('banned-list').innerHTML='<div class="no-firebase">Firebase required.</div>';
      document.getElementById('stat-viewers').textContent='—';
      document.getElementById('stat-banned').textContent='0';
      document.getElementById('stat-msgs').textContent='0';
      loadStreams();
      return;
    }

    loadStreams();

    // watch total viewers
    db.ref('viewers').on('value', function(snap){
      var total = 0;
      snap.forEach(function(stream){ total += stream.numChildren(); });
      document.getElementById('stat-viewers').textContent = total || '0';
    });

    // watch banned users
    db.ref('banned').on('value', function(snap){
      bannedUsers = snap.val() || {};
      var count = Object.keys(bannedUsers).length;
      document.getElementById('stat-banned').textContent = count;
      document.getElementById('ban-sub').textContent = count + ' banned';
      renderBanned();
    });

    loadMessages();

    document.getElementById('refresh-msgs').addEventListener('click', loadMessages);
  }

  function loadStreams() {
    fetch(API+'/streams').then(function(r){return r.json();}).then(function(data){
      var streams = data.streams || [];
      var live = 0;
      streams.forEach(function(s){
        var id = slugify(s.name);
        streamNames[id] = s.name;
        var ts = s.match_timestamp;
        if (!ts || ts <= Date.now()/1000+300) live++;
      });
      document.getElementById('stat-live').textContent = live;
    }).catch(function(){});
  }

  function loadMessages() {
    if (!FIREBASE_READY || !db) return;
    var msgList = document.getElementById('msg-list');
    msgList.innerHTML = '<div class="empty-state">Loading…</div>';
    allMessages = [];

    db.ref('chats').once('value', function(snap){
      snap.forEach(function(stream){
        var sid = stream.key;
        stream.child('messages').forEach(function(msg){
          var d = msg.val();
          if (d && !d.deleted) {
            allMessages.push({ key: msg.key, streamId: sid, streamName: streamNames[sid]||sid, username: d.username, text: d.text, ts: d.ts });
          }
        });
      });
      allMessages.sort(function(a,b){return b.ts-a.ts;});
      document.getElementById('stat-msgs').textContent = allMessages.length;
      document.getElementById('msg-sub').textContent = allMessages.length + ' messages across all streams';
      renderMessages();
    });
  }

  function renderMessages() {
    var msgList = document.getElementById('msg-list');
    if (!allMessages.length) { msgList.innerHTML='<div class="empty-state">No messages yet.</div>'; return; }
    msgList.innerHTML = '';
    allMessages.slice(0,200).forEach(function(m){
      var row = document.createElement('div'); row.className='msg-row';

      var left = document.createElement('div');
      var user = document.createElement('div'); user.className='msg-row-user'; user.textContent=m.username; left.appendChild(user);
      var stream = document.createElement('div'); stream.className='msg-row-stream'; stream.textContent=m.streamName; left.appendChild(stream);
      row.appendChild(left);

      var text = document.createElement('div'); text.className='msg-row-text'; text.textContent=m.text; row.appendChild(text);
      var time = document.createElement('div'); time.className='msg-row-time'; time.textContent=fmtTime(m.ts); row.appendChild(time);

      var actions = document.createElement('div'); actions.className='msg-row-actions';

      var delBtn = document.createElement('button'); delBtn.className='del-btn'; delBtn.textContent='Delete';
      delBtn.addEventListener('click', function(){
        db.ref('chats/'+m.streamId+'/messages/'+m.key).update({deleted:true}).then(function(){
          row.style.opacity='.3'; delBtn.textContent='Deleted'; delBtn.disabled=true;
          allMessages=allMessages.filter(function(x){return x.key!==m.key;});
          document.getElementById('stat-msgs').textContent=allMessages.length;
        });
      });
      actions.appendChild(delBtn);

      var isBanned = bannedUsers[m.username];
      var banBtn = document.createElement('button'); banBtn.className='ban-btn'+(isBanned?' banned':''); banBtn.textContent=isBanned?'Unban':'Ban';
      banBtn.addEventListener('click', function(){
        if (bannedUsers[m.username]) {
          db.ref('banned/'+m.username).remove().then(function(){ banBtn.textContent='Ban'; banBtn.classList.remove('banned'); });
        } else {
          db.ref('banned/'+m.username).set(true).then(function(){ banBtn.textContent='Unban'; banBtn.classList.add('banned'); });
        }
      });
      actions.appendChild(banBtn);

      row.appendChild(actions);
      msgList.appendChild(row);
    });
  }

  function renderBanned() {
    var list = document.getElementById('banned-list');
    var keys = Object.keys(bannedUsers);
    if (!keys.length) { list.innerHTML='<div class="empty-state">No banned users.</div>'; return; }
    list.innerHTML = '';
    keys.forEach(function(u){
      var row = document.createElement('div'); row.className='banned-row';
      var name = document.createElement('span'); name.className='banned-name'; name.textContent=u; row.appendChild(name);
      var btn = document.createElement('button'); btn.className='unban-btn'; btn.textContent='Unban';
      btn.addEventListener('click',function(){ db.ref('banned/'+u).remove(); });
      row.appendChild(btn); list.appendChild(row);
    });
  }

})();
</script>
</body>
</html>
